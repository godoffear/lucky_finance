<style>
:root{
  --bg:#E8EDF1; --surface:#FFFFFF; --ink:#16202B; --muted:#66757F; --line:#D5DDE3;
  --income:#17805A; --income-soft:#DDF1E8;
  --expense:#CF3E36; --expense-soft:#F9E1DF;
  --fx:#2C52D0; --fx-soft:#E1E8FB; --gold:#B8860B; --gold-soft:#FBF1D0;
  --hero:#16202B; --hero-ink:#F2F5F7; --hero-muted:#9BAAB6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151D; --surface:#17212C; --ink:#E6EDF3; --muted:#8D9CA8; --line:#263341;
    --income:#3FBF8C; --income-soft:#173A2E;
    --expense:#F0726A; --expense-soft:#41211F;
    --fx:#7E9CFF; --fx-soft:#1E2A4D; --gold:#E6C25A; --gold-soft:#3A3117;
    --hero:#1F2C3A; --hero-ink:#F2F5F7; --hero-muted:#9BAAB6;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151D; --surface:#17212C; --ink:#E6EDF3; --muted:#8D9CA8; --line:#263341;
  --income:#3FBF8C; --income-soft:#173A2E;
  --expense:#F0726A; --expense-soft:#41211F;
  --fx:#7E9CFF; --fx-soft:#1E2A4D; --gold:#E6C25A; --gold-soft:#3A3117;
  --hero:#1F2C3A; --hero-ink:#F2F5F7; --hero-muted:#9BAAB6;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:480px;margin:0 auto;padding:18px 16px 130px}
h1{font:600 20px/1.2 'Unbounded','Onest',system-ui,sans-serif;margin:4px 0 14px;letter-spacing:-.01em}
h2{font:600 18px/1.2 'Unbounded','Onest',system-ui,sans-serif;margin:0 0 4px}
h3{font-size:14px;font-weight:600;margin:0 0 10px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.num{font-variant-numeric:tabular-nums}

/* Balance card */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:26px;padding:22px 20px 20px;cursor:pointer;position:relative;overflow:hidden;user-select:none}
.hero .lbl{font-size:13px;color:var(--hero-muted)}
.hero .big{font:600 32px/1.15 'Unbounded','Onest',system-ui,sans-serif;margin:8px 0 6px;letter-spacing:-.02em;transition:filter .3s}
.hero:not(.open) .big{filter:blur(13px)}
.hero .tap{font-size:12px;color:var(--hero-muted)}
.hero .miss{font-size:12px;color:var(--hero-muted);margin-top:6px}

/* Quick actions */
.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.qa{background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500}
.qa i{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font:600 22px/1 'Onest',sans-serif;font-style:normal}
.qa .g{background:var(--income-soft);color:var(--income)}
.qa .r{background:var(--expense-soft);color:var(--expense)}
.qa .b{background:var(--fx-soft);color:var(--fx)}

/* Lists */
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.item:first-child{border-top:0}
.ic{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:18px;background:var(--bg)}
.ic.income{background:var(--income-soft)} .ic.expense{background:var(--expense-soft)} .ic.exchange,.ic.transfer{background:var(--fx-soft);color:var(--fx);font-weight:600}
.grow{flex:1;min-width:0}
.t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{text-align:right;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.amt small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.pos{color:var(--income)} .neg{color:var(--expense)} .fx{color:var(--fx)}
.grp{font-size:13px;font-weight:600;color:var(--muted);margin:20px 4px 2px}
.bar{height:6px;border-radius:3px;background:var(--bg);margin-top:6px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--expense);border-radius:3px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

/* Chips & segments */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 0}
.seg button{padding:10px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.seg button.on.income{background:var(--income-soft);border-color:var(--income);color:var(--income)}
.seg button.on.expense{background:var(--expense-soft);border-color:var(--expense);color:var(--expense)}
.seg button.on.exchange,.seg button.on.transfer{background:var(--fx-soft);border-color:var(--fx);color:var(--fx)}

/* Forms */
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 0}
input,select,textarea{width:100%;margin-top:6px;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;appearance:none;-webkit-appearance:none}
textarea{min-height:110px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--fx);outline-offset:1px}
.amtwrap{position:relative}
.amtwrap input{padding-right:64px;font-weight:600;font-size:20px}
.amtwrap span{position:absolute;right:14px;top:50%;transform:translateY(-38%);color:var(--muted);font-weight:600}
.hint{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px}
.warn{color:var(--expense)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;font-weight:600;font-size:16px;background:var(--fx);color:#fff;margin-top:18px}
.btn.income{background:var(--income)} .btn.expense{background:var(--expense)}
.btn.ghost{background:transparent;color:var(--expense);border:1px solid var(--line)}
.btn.plain{background:var(--bg);color:var(--ink)}
.btn.sm{display:inline-block;width:auto;padding:10px 16px;font-size:14px;margin-top:10px;border-radius:12px}

/* Nav & FAB */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:500}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink)}
nav button.on svg{stroke:var(--fx)}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:0;background:var(--fx);color:#fff;font-size:24px;opacity:.82;z-index:6;display:grid;place-items:center}
.fab:active{opacity:1}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(10,16,22,.5)}
.sheet{position:relative;width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
#toast.show{opacity:1}

.hero .vc{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.hero .vc button{padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--hero-ink);font-size:13px;font-weight:500}
.hero .vc button.on{background:var(--hero-ink);color:var(--hero);border-color:var(--hero-ink)}
.ic.save,.ic.unsave{background:var(--fx-soft)}
.pbar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.pbar b{display:block;height:100%;background:var(--income);border-radius:5px}
.pbar.gold b{background:var(--gold)}
.card.gold{border-color:var(--gold);background:var(--gold-soft)}
.cols{display:flex;align-items:flex-end;gap:10px;height:110px;margin-top:8px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:11px;color:var(--muted)}
.col .pair{display:flex;align-items:flex-end;gap:3px;height:88px;width:100%;justify-content:center}
.col .pair i{display:block;width:40%;max-width:14px;border-radius:4px 4px 0 0;min-height:2px}
.col .pair .a{background:var(--income)} .col .pair .b{background:var(--expense)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.sw{flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--income)}
.sw.on::after{transform:translateX(18px)}
.hero .vc button.pk{border-style:dashed;margin-left:auto}
.pbar.warn b{background:var(--gold)}
.pbar.over b{background:var(--expense)}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px;display:grid;place-items:center;padding:0;flex:none}
.ib.on{border-color:var(--fx);background:var(--fx-soft)}

.sheet-head{position:sticky;top:0;z-index:3;background:var(--surface);margin:0 -20px 4px;padding:10px 20px 8px;display:flex;justify-content:center;align-items:center;border-radius:24px 24px 0 0}
.sheet-x{position:absolute;right:16px;top:8px;width:30px;height:30px;border-radius:50%;background:var(--bg);color:var(--muted);border:0;font-size:15px;display:grid;place-items:center;padding:0}
.backbar{position:sticky;top:0;z-index:4;background:var(--bg);margin:0 -16px 10px;padding:10px 16px 6px}
.amtflex{display:flex;gap:8px}
.k000{flex:none;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;color:var(--ink)}
.catpop{position:relative}
.ib.plus{font-size:22px;line-height:1}
.catgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:4px}
.catgrid button{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 0;font-size:20px}
.catgrid button.on{border-color:var(--fx);background:var(--fx-soft)}
#kbhide{position:fixed;right:16px;bottom:16px;z-index:50;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);border:0;display:none;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.28)}
#kbhide.show{display:grid}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

}

var persisted=null;

/* ---------- Состояние ---------- */
function fresh(){return {settings:{main:'RUB',rates:{},custom:[],lastAcc:'',view:'',goal:null,lastBackup:0,favs:DEF_FAVS.slice(),limit:null,wizardDone:false,must:['Жильё','Связь'],recon:{on:true,days:7,accs:{}},expInc:null,catIcons:{},rateMode:'own'},accounts:[],tx:[],inv:[],rec:[],tpl:[],auto:AUTO_DEFAULT,mkt:null,seq:1};}

function normalize(o){
  var s=fresh();
  s.settings=Object.assign(s.settings,o.settings||{});
  s.settings.rates=s.settings.rates||{};s.settings.custom=s.settings.custom||[];
  s.accounts=o.accounts||[];s.tx=o.tx||[];
  var m=0;s.tx.forEach(function(t){if(t.seq>m)m=t.seq;});s.seq=Math.max(o.seq||1,m+1);

  if(!s.settings.recon.accs)s.settings.recon.accs={};

function fmtField(el,e){

  if(pos==null||pos>raw.length)pos=raw.length;
  if(it==='deleteContentBackward'&&el.__pv&&el.__pv.length===raw.length+1&&el.__pv.charAt(pos)==='.'&&pos>0){raw=raw.slice(0,pos-1)+raw.slice(pos);pos--;}
  var ip,dec=null,cnt,di;
  var heur=(it==='insertFromPaste'||it==='insertCompositionText'||it==='insertReplacementText'||(it==='insertText'&&e&&typeof e.data==='string'&&e.data.length>1));
  if(heur){
    var t=raw.replace(/[^\d.,]/g,''),lc=t.lastIndexOf(','),ld=t.lastIndexOf('.');di=-1;
    if(lc>=0&&ld>=0)di=Math.max(lc,ld);

    if(di>=0){ip=t.slice(0,di).replace(/[.,]/g,'');dec=t.slice(di+1).replace(/[.,]/g,'');}else ip=t.replace(/[.,]/g,'');
    cnt=null;
  }else{
    var s2=raw,lead;
    if((typed==='.'||typed===',')&&pos>0){
      s2=raw.slice(0,pos-1)+'#'+raw.slice(pos);
      if(s2.replace('#','').indexOf(',')>=0){s2=raw.slice(0,pos-1)+raw.slice(pos);lead=raw.slice(0,pos-1);}else lead=s2.slice(0,pos);
    }else lead=raw.slice(0,pos);
    cnt=(lead.match(/[\d,#]/g)||[]).length;
    s2=s2.replace(/[^\d,#]/g,'');
    di=s2.search(/[#,]/);
    if(di>=0){ip=s2.slice(0,di);dec=s2.slice(di+1).replace(/[#,]/g,'');}else ip=s2;
  }
  ip=ip.replace(/^0+(?=\d)/,'');
  if(ip===''&&dec!==null){ip='0';if(cnt!==null)cnt++;}
  var out=grp(ip)+(dec!==null?','+dec:'');
  if(out!==el.value)el.value=out;
  el.__pv=out;
  var np=out.length;
  if(cnt!==null){var c=0;np=0;while(np<out.length&&c<cnt){if(/[\d,]/.test(out.charAt(np)))c++;np++;}}

/* ---------- Расчёт: воспроизводим все операции по порядку (FIFO) ---------- */
function compute(){
  var main=S.settings.main,accs={},info={},pairs={},sav={};
  function svAcc(cur){return sav[cur]||(sav[cur]={bal:0,lots:[],cur:cur});}
  S.accounts.forEach(function(a){accs[a.id]={bal:0,lots:[],cur:a.cur};});
  function consume(A,amount){
    var parts=[],need=amount;
    if(A.cur===main)return {parts:parts,lack:0};
    while(need>1e-9&&A.lots.length){
      var l=A.lots[0],take=Math.min(l.amt,need);
      parts.push({amt:take,rate:l.rate,src:l.src,est:l.est,date:l.date});
      l.amt-=take;need-=take;if(l.amt<=1e-9)A.lots.shift();
    }
    return {parts:parts,lack:need>1e-9?need:0};
  }
  function costOf(parts,lack){
    var cost=0,unknown=lack,est=0;
    parts.forEach(function(p){if(p.src===main&&p.rate!=null){cost+=p.amt*p.rate;if(p.est)est+=p.amt;}else unknown+=p.amt;});
    return {cost:cost,unknown:unknown,est:est};
  }
  S.tx.slice().sort(cmp).forEach(function(t){
    var A=accs[t.acc];if(!A)return;
    if(t.type==='income'){
      A.bal+=t.amount;
      if(A.cur!==main){var r=t.rateMain>0?t.rateMain:null,est=false;if(r==null){var fr=rateToMain(A.cur);if(fr!=null){r=fr;est=true;}}A.lots.push({amt:t.amount,rate:r,src:r?main:null,est:est,date:t.date});}
    }else if(t.type==='expense'){
      A.bal-=t.amount;
      if(A.cur!==main){var c=consume(A,t.amount);info[t.id]=costOf(c.parts,c.lack);}
    }else if(t.type==='transfer'){
      var B=accs[t.to];if(!B)return;
      A.bal-=t.amount;B.bal+=t.amount;
      if(A.cur!==main){
        var c2=consume(A,t.amount);
        c2.parts.forEach(function(p){B.lots.push({amt:p.amt,rate:p.rate,src:p.src,est:p.est,date:p.date});});
        if(c2.lack>0)B.lots.push({amt:c2.lack,rate:null,src:null,date:t.date});
      }
    }else if(t.type==='exchange'){
      var B2=accs[t.to];if(!B2)return;
      A.bal-=t.amount;B2.bal+=t.toAmount;
      var rate,src,estF=false;
      if(A.cur===main){rate=t.amount/t.toAmount;src=main;}
      else{
        var c3=consume(A,t.amount),k=costOf(c3.parts,c3.lack);
        if(k.unknown<=1e-9){rate=k.cost/t.toAmount;src=main;estF=k.est>1e-9;}else{rate=t.amount/t.toAmount;src=A.cur;}
      }
      if(B2.cur!==main)B2.lots.push({amt:t.toAmount,rate:rate,src:src,est:estF,date:t.date});
      var key=A.cur+'>'+B2.cur;
      var p=pairs[key]||(pairs[key]={from:A.cur,to:B2.cur,given:0,got:0});
      p.given+=t.amount;p.got+=t.toAmount;
    }else if(t.type==='save'){
      var V=svAcc(A.cur);A.bal-=t.amount;V.bal+=t.amount;
      if(A.cur!==main){
        var c4=consume(A,t.amount);
        c4.parts.forEach(function(p2){V.lots.push({amt:p2.amt,rate:p2.rate,src:p2.src,est:p2.est,date:p2.date});});
        if(c4.lack>0)V.lots.push({amt:c4.lack,rate:null,src:null,date:t.date});
      }
    }else if(t.type==='unsave'){
      var V2=svAcc(A.cur);A.bal+=t.amount;V2.bal-=t.amount;
      if(A.cur!==main){
        var c5=consume(V2,t.amount);
        c5.parts.forEach(function(p3){A.lots.push({amt:p3.amt,rate:p3.rate,src:p3.src,est:p3.est,date:p3.date});});
        if(c5.lack>0)A.lots.push({amt:c5.lack,rate:null,src:null,date:t.date});
      }
    }
  });
  return {accs:accs,info:info,pairs:pairs,sav:sav};
}
function simulate(accId,amount){
  var a=getAcc(accId),main=S.settings.main;if(!a||a.cur===main||!C.accs[accId])return null;
  var need=amount,cost=0,unknown=0,est=0;
  C.accs[accId].lots.forEach(function(l){
    if(need<=1e-9)return;var take=Math.min(l.amt,need);
    if(l.src===main&&l.rate!=null){cost+=take*l.rate;if(l.est)est+=take;}else unknown+=take;need-=take;
  });
  if(need>1e-9)unknown+=need;
  return {cost:cost,unknown:unknown,est:est};
}
function tblRate(t,c){
  if(!t||!t.rub)return null;var v=t.rub[c];
  if(!(v>0)&&(c==='USDT'||c==='USDC'))v=t.rub.USD;
  return v>0?v:null;
}
function autoRate(cur){
  var main=S.settings.main,tabs=[S.mkt,S.auto];
  for(var i=0;i<tabs.length;i++){
    var c=tblRate(tabs[i],cur),m=tblRate(tabs[i],main);
    if(c&&m)return {r:c/m,mkt:i===0};
  }
  return null;
}
function rateInfo(cur){
  var main=S.settings.main;if(cur===main)return {r:1,src:''};
  if((S.settings.rateMode||'own')==='own'){
    var ex=S.tx.filter(function(t){return t.type==='exchange';}).sort(cmp).reverse();
    for(var i=0;i<ex.length;i++){
      var t=ex[i],a=getAcc(t.acc),b=getAcc(t.to);if(!a||!b)continue;
      if(a.cur===main&&b.cur===cur)return {r:t.amount/t.toAmount,src:'по твоему последнему обмену'};
      if(a.cur===cur&&b.cur===main)return {r:t.toAmount/t.amount,src:'по твоему последнему обмену'};
    }
    var m=S.settings.rates[cur];if(m>0)return {r:m,src:'заданный тобой вручную'};
  }
  var au=autoRate(cur);
  if(au)return {r:au.r,src:au.mkt?'рыночный курс на '+dshort(S.mkt.date):'ЦБ РФ на '+dshort(S.auto.date)};
  return {r:null,src:''};
}
function rateToMain(cur){return rateInfo(cur).r;}
function txToMain(t){
  var a=getAcc(t.acc);if(!a)return null;var main=S.settings.main;
  if(a.cur===main)return t.amount;
  var i=C.info[t.id];if(t.type==='expense'&&i&&i.unknown<1e-9)return i.cost;
  var r=rateToMain(a.cur);return r==null?null:t.amount*r;
}
function holdings(){
  var main=S.settings.main,h={};
  S.accounts.forEach(function(a){
    if(a.cur===main)return;
    var x=h[a.cur]||(h[a.cur]={cur:a.cur,bal:0,known:0,cost:0,unk:0,est:0});
    x.bal+=C.accs[a.id].bal;
    C.accs[a.id].lots.forEach(function(l){if(l.src===main&&l.rate!=null){x.known+=l.amt;x.cost+=l.amt*l.rate;if(l.est)x.est+=l.amt;}else x.unk+=l.amt;});
  });
  return Object.keys(h).map(function(k){return h[k];}).filter(function(x){return Math.abs(x.bal)>1e-9;});
}

function opsFiltered(){
  var f=nav.filter,q=(nav.q||'').trim().toLowerCase(),per=nav.per||'all',t0=today(),cur=t0.slice(0,7),prev=shiftMonth(cur,-1),from=null,to=null;
  if(per==='month'){from=cur+'-01';to=cur+'-31';}
  else if(per==='prev'){from=prev+'-01';to=prev+'-31';}
  else if(per==='30'){from=new Date(Date.now()-new Date().getTimezoneOffset()*60000-29*864e5).toISOString().slice(0,10);to='9999-12-31';}
  else if(per==='year'){from=t0.slice(0,4)+'-01-01';to=t0.slice(0,4)+'-12-31';}
  var TL={income:'доход',expense:'расход',transfer:'перевод',exchange:'обмен',save:'накопления',unsave:'накопления'};
  return S.tx.filter(function(t){
    if(!(f==='all'||t.type===f||(f==='save'&&t.type==='unsave')))return false;
    if(from&&(t.date<from||t.date>to))return false;
    if(nav.facc&&t.acc!==nav.facc&&t.to!==nav.facc)return false;
    if(nav.fcat&&t.cat!==nav.fcat)return false;
    if(q){
      var a=getAcc(t.acc),b=t.to?getAcc(t.to):null;
      var hay=((t.cat||'')+' '+(t.note||'')+' '+(a?a.name:'')+' '+(b?b.name:'')+' '+t.amount+' '+(t.toAmount||'')+' '+(TL[t.type]||'')).toLowerCase();
      if(hay.indexOf(q)<0)return false;
    }
    return true;
  }).sort(cmp).reverse();
}

function dec(n){return String(n).replace('.',',');}
function csvCell(v){v=String(v==null?'':v);return /[";\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function csvOps(list){
  var TL={income:'Доход',expense:'Расход',transfer:'Перевод',exchange:'Обмен',save:'В накопления',unsave:'Из накоплений'};
  var rows=[['Дата','Тип','Категория','Счёт','Сумма','Валюта','Счёт назначения','Получено','Валюта получения','Заметка']];
  list.slice().reverse().forEach(function(t){
    var a=getAcc(t.acc),b=t.to?getAcc(t.to):null;
    rows.push([t.date,TL[t.type]||t.type,t.cat||'',a?a.name:'',dec(t.amount),a?a.cur:'',b?b.name:'',t.type==='exchange'?dec(t.toAmount):'',b&&t.type==='exchange'?b.cur:'',t.note||'']);
  });
  return '\ufeff'+rows.map(function(r){return r.map(csvCell).join(';');}).join('\r\n');
}

function savingsTotal(){
  var sum=0,miss=[],per=[];
  Object.keys(C.sav).forEach(function(c){

    per.push({cur:c,bal:b});var r=rateToMain(c);

}

function monthStats(ym){
  var s={inc:0,exp:0,cats:{},big:[],miss:0,est:false};
  S.tx.forEach(function(t){
    if(t.opening||t.date.slice(0,7)!==ym)return;
    if(t.type!=='income'&&t.type!=='expense')return;
    var v=txToMain(t);if(v==null){s.miss++;return;}
    if(t.type==='income')s.inc+=v;
    else{s.exp+=v;s.cats[t.cat]=(s.cats[t.cat]||0)+v;s.big.push({t:t,v:v});var i=C.info[t.id];if(i&&i.est>1e-9)s.est=true;}
  });
  return s;
}
function shiftMonth(ym,n){var d=new Date(+ym.slice(0,4),+ym.slice(5,7)-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function delta(a,b,expense){
  if(!(b>0))return '';
  var p=Math.round((a-b)/b*100);
  if(p===0)return '<small>как в прошлом месяце</small>';
  var up=p>0,bad=expense?up:!up;
  return '<small class="'+(bad?'neg':'pos')+'">'+(up?'+':'−')+Math.abs(p)+'% к прошлому месяцу</small>';
}

function freqCats(type){
  var n={};S.tx.forEach(function(t){if(t.type===type&&t.cat&&!t.opening)n[t.cat]=(n[t.cat]||0)+1;});
  return Object.keys(n).sort(function(a,b){return n[b]-n[a];}).slice(0,6);
}
function catsFor(type){
  var base=type==='income'?INC:EXP;
  var used=[];S.tx.forEach(function(t){if(t.type===type&&t.cat&&!t.opening&&base.indexOf(t.cat)<0&&used.indexOf(t.cat)<0)used.push(t.cat);});
  return base.concat(used);
}

  var mk=[];

function saveAcc(){

}

function downloadBlob(name,text,mime){
  try{
    var b=new Blob([text],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(u);},1500);
    return true;
  }catch(e){return false;}
}
function deliverFile(name,text,mime){
  var file=null;try{file=new File([text],name,{type:mime});}catch(e){}
  if(isIOS()&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
    return navigator.share({files:[file],title:name}).then(function(){return true;}).catch(function(e){
      if(e&&e.name==='AbortError')return false;
      return downloadBlob(name,text,mime);
    });
  }
  return Promise.resolve(downloadBlob(name,text,mime));
}

function buildTpls(type){
  var m={};
  S.tx.forEach(function(t){
    if(t.type!==type||t.opening||!getAcc(t.acc))return;
    var k=t.acc+'|'+(t.cat||'')+'|'+t.amount,o=m[k]||(m[k]={acc:t.acc,cat:t.cat||'Другое',amount:t.amount,n:0,last:''});
    o.n++;if(t.date>o.last)o.last=t.date;
  });
  var all=Object.keys(m).map(function(k){return m[k];});
  var freq=all.filter(function(o){return o.n>=2;}).sort(function(a,b){return b.n-a.n||(a.last<b.last?1:-1);});
  var rec=all.filter(function(o){return o.n<2;}).sort(function(a,b){return a.last<b.last?1:-1;});
  return freq.concat(rec).slice(0,5);
}

function limits(){return S.settings.limit||{total:0,cats:{}};}
function monthProgress(){
  var t=today(),ym=t.slice(0,7),dim=new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();
  return {st:monthStats(ym),dim:dim,daysLeft:dim-(+t.slice(8,10))+1};
}
function limBar(spent,limit){
  var p=limit>0?spent/limit*100:0;
  return '<div class="pbar'+(p>=100?' over':p>=80?' warn':'')+'" style="margin-top:6px"><b style="width:'+Math.min(100,Math.max(2,p))+'%"></b></div>';
}
function limitHome(){
  var main=S.settings.main,l=limits();
  if(!(l.total>0)&&!Object.keys(l.cats).length)return '';
  var mp=monthProgress(),st=mp.st,warn=[];
  Object.keys(l.cats).forEach(function(c){var lim=l.cats[c],v=st.cats[c]||0;if(lim>0&&v>=lim*0.8)warn.push(esc(c)+' '+Math.round(v/lim*100)+'%');});
  if(!(l.total>0)&&!warn.length)return '';
  var h='<div class="card" data-a="sub" data-v="limits" style="cursor:pointer;padding:12px 16px">';
  if(l.total>0){
    var left=l.total-st.exp;
    h+='<div class="t2">Лимит месяца</div><div class="t1" style="white-space:normal">'+(left>=0?'Осталось '+fmt(left,main)+' · можно ~'+fmt(left/mp.daysLeft,main)+' в день':'Превышен на '+fmt(-left,main))+'</div>'+limBar(st.exp,l.total);
  }
  if(warn.length)h+='<div class="small" style="margin-top:8px;color:var(--expense)">Внимание: '+warn.join(', ')+'</div>';
  return h+'</div>';
}
function limitMsg(t){
  if(t.type!=='expense'||t.opening)return '';
  var l=limits();if(!(l.total>0)&&!Object.keys(l.cats).length)return '';
  var ym=today().slice(0,7);if(t.date.slice(0,7)!==ym)return '';
  var v=txToMain(t);if(v==null)return '';
  var st=monthStats(ym),msgs=[];
  if(l.total>0){var b=st.exp-v;if(b<l.total&&st.exp>=l.total)msgs.push('лимит месяца превышен');else if(b<l.total*0.8&&st.exp>=l.total*0.8)msgs.push('потрачено 80% лимита месяца');}
  var cl=l.cats[t.cat];
  if(cl>0){var cs=st.cats[t.cat]||0,cb=cs-v;if(cb<cl&&cs>=cl)msgs.push('лимит «'+t.cat+'» превышен');else if(cb<cl*0.8&&cs>=cl*0.8)msgs.push('«'+t.cat+'»: 80% лимита');}
  return msgs.length?msgs.join(', ').replace(/^./,function(c){return c.toUpperCase();}):'';
}

/* Постоянные платежи */
function dueDate(ym,day){var dim=new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();return ym+'-'+String(Math.min(day,dim)).padStart(2,'0');}
function recDue(){
  var t=today(),cur=t.slice(0,7),prev=shiftMonth(cur,-1),out=[];
  S.rec.forEach(function(r){
    if(!getAcc(r.acc))return;
    [prev,cur].forEach(function(ym){
      if(ym<r.created||(r.done&&r.done[ym]))return;
      var d=dueDate(ym,r.day);if(d<=t)out.push({r:r,ym:ym,date:d});
    });
  });
  return out.sort(function(a,b){return a.date<b.date?-1:1;});
}
function recUpcoming(cur,days){
  var t=today(),end=new Date(Date.now()+days*864e5).toISOString().slice(0,10),ym=t.slice(0,7),sum=0;
  S.rec.forEach(function(r){
    var a=getAcc(r.acc);if(!a||a.cur!==cur)return;
    for(var i=-1;i<=Math.ceil(days/28)+1;i++){
      var m=shiftMonth(ym,i);if(m<r.created||(r.done&&r.done[m]))continue;
      if(dueDate(m,r.day)<=end)sum+=r.amount;
    }
  });
  return sum;
}
function recHome(){
  var dues=recDue();if(!dues.length)return '';
  var main=S.settings.main;
  return '<div class="card" style="border-color:var(--fx)"><h3 style="color:var(--ink)">Пора внести платежи</h3>'+dues.slice(0,3).map(function(d){

}

function saveRec(){
  var name=(F.name||'').trim(),x=num(F.amountS),d=Math.round(num(F.dayS));
  if(!name){toast('Введи название');return;}
  if(!(x>0)){toast('Введи сумму');return;}
  if(!(d>=1&&d<=31)){toast('Число месяца: от 1 до 31');return;}
  var o={id:F.id||uid(),name:name,amount:x,acc:F.acc,cat:F.cat||'Другое',day:d,done:{}};
  var i=S.rec.findIndex(function(r){return r.id===o.id;});
  if(i>=0){o.done=S.rec[i].done||{};o.created=S.rec[i].created;S.rec[i]=o;}
  else{var t=today(),cur=t.slice(0,7);o.created=dueDate(cur,d)<t?shiftMonth(cur,1):cur;S.rec.push(o);}
  closeSheet();commit();toast('Сохранено');
}

/* На сколько хватит и калькулятор обмена */
function plural(n,a,b,c){var m=n%100,k=n%10;if(m>10&&m<20)return c;if(k===1)return a;if(k>1&&k<5)return b;return c;}
function fmtDays(d){if(d==null)return '—';if(d>=365)return 'больше года';if(d<1)return 'меньше суток';var n=Math.floor(d);return n+' '+plural(n,'день','дня','дней');}
function endDate(d){return new Date(Date.now()+Math.floor(d)*864e5).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});}
function calcTotal(){
  var main=S.settings.main,total=0;
  S.accounts.forEach(function(a){
    if(a.excl)return;var b=C.accs[a.id].bal;
    if(a.cur===main){total+=b;return;}
    var r=rateToMain(a.cur);if(r!=null)total+=b*r;
  });
  return total;
}
function curBalance(cur){var b=0;S.accounts.forEach(function(a){if(a.cur===cur&&!a.excl)b+=C.accs[a.id].bal;});return b;}
function mustCats(){return S.settings.must||[];}
function isMust(x){return !!(x.rec||mustCats().indexOf(x.cat)>=0);}
function catCovered(cat,cur){return S.rec.some(function(r){var a=getAcc(r.acc);return r.cat===cat&&a&&a.cur===cur;});}
function monthlyRec(cur){var s=0;S.rec.forEach(function(r){var a=getAcc(r.acc);if(a&&a.cur===cur)s+=r.amount;});return s;}
function runDays(bal,perDay,sched){
  if(!(bal>0))return 0;
  for(var d=1;d<=366;d++){if(perDay*d+sched(d)>bal)return d-1;}
  return 400;
}
/* Прогноз: повседневные траты — в день; постоянные платежи вычитаются в свои дни;
   обязательные траты без расписания учитываются усреднённо за месяц. */
function runway(o){
  var t=today(),first=null;
  S.tx.forEach(function(x){if(x.opening)return;if(!first||x.date<first)first=x.date;});
  if(!first)return {basis:0,per:[],total:null,gaps:[]};
  var since=Math.round((new Date(t+'T00:00:00')-new Date(first+'T00:00:00'))/864e5)+1;
  var basis=Math.max(3,Math.min(30,since));
  function ago(n){return new Date(Date.now()-new Date().getTimezoneOffset()*60000-n*864e5).toISOString().slice(0,10);}
  var fromV=ago(basis-1),fromU=ago(29),V={},U={},G={};
  S.tx.forEach(function(x){
    if(x.type!=='expense'||x.opening)return;
    var a=getAcc(x.acc);if(!a)return;var c=a.cur;
    if(!isMust(x)){if(x.date>=fromV)V[c]=(V[c]||0)+x.amount;return;}
    if(x.rec||x.date<fromU||catCovered(x.cat,c))return;
    U[c]=(U[c]||0)+x.amount;
    var k=c+'|'+x.cat,g=G[k]||(G[k]={cur:c,cat:x.cat,sum:0,acc:x.acc,amount:x.amount,date:x.date});
    g.sum+=x.amount;if(x.date>=g.date){g.acc=x.acc;g.amount=x.amount;g.date=x.date;}
  });
  var curs=[];
  [V,U].forEach(function(m){Object.keys(m).forEach(function(c){if(curs.indexOf(c)<0)curs.push(c);});});
  S.rec.forEach(function(r){var a=getAcc(r.acc);if(a&&curs.indexOf(a.cur)<0)curs.push(a.cur);});
  var list=curs.map(function(c){
    var v=(V[c]||0)/basis,u=(U[c]||0)/30,bal=curBalance(c),r=rateToMain(c)||0,mr=monthlyRec(c);
    var days=(v+u<=0&&mr<=0)?null:runDays(bal,v+u,function(d){return recUpcoming(c,d);});
    return {cur:c,daily:v,unsch:u,bal:bal,days:days,monthRec:mr,monthMust:u*30+mr,sched30:recUpcoming(c,30),unsch30:u*30,w:((v+u)*30+mr)*r};
  }).sort(function(a,b){return b.w-a.w;});
  var Vm=0,Um=0,mm=0,mrm=0,s30=0,rcs=[];
  list.forEach(function(p){var r=rateToMain(p.cur);if(r==null)return;Vm+=p.daily*r;Um+=p.unsch*r;mm+=p.monthMust*r;mrm+=p.monthRec*r;s30+=p.sched30*r;rcs.push({c:p.cur,r:r});});
  var tot=null;
  if(Vm+Um>0||mm>0){
    var tb=calcTotal();
    tot={daily:Vm,unsch:Um,bal:tb,monthMust:mm,monthRec:mrm,sched30:s30,unsch30:Um*30,days:runDays(tb,Vm+Um,function(d){var sm=0;rcs.forEach(function(x){sm+=recUpcoming(x.c,d)*x.r;});return sm;})};
  }
  return {basis:basis,per:list,total:tot,gaps:Object.keys(G).map(function(k){return G[k];})};
}
function runwayCard(){
  var rw=runway(),main=S.settings.main;
  if(!rw.per.length)return '';
  var h='<div class="card"><h3>На сколько хватит денег</h3>';
  rw.per.forEach(function(p){
    h+='<div class="row" style="padding:6px 0"><div class="grow"><div class="t1">'+p.cur+'</div><div class="t2">повседневно ~'+fmt(p.daily,p.cur)+' в день'+(p.monthMust>0?' · обязательные ~'+fmt(p.monthMust,p.cur)+' в месяц':'')+' · на счетах '+fmt(p.bal,p.cur)+'</div></div><div class="amt num">'+(p.days==null?'—':'~'+fmtDays(p.days))+(p.days!=null&&p.days<365?'<small>до '+endDate(p.days)+'</small>':'')+'</div></div>';
  });
  if(rw.total&&rw.per.length>1)h+='<div class="row" style="padding:8px 0 0;margin-top:6px;border-top:1px solid var(--line)"><div class="grow"><div class="t1">Всего</div><div class="t2">все счета вместе, в пересчёте на '+main+'</div></div><div class="amt num">~'+fmtDays(rw.total.days)+(rw.total.days<365?'<small>до '+endDate(rw.total.days)+'</small>':'')+'</div></div>';
  h+='<div class="small muted" style="margin-top:8px">Повседневные траты считаются по последним '+rw.basis+' '+plural(rw.basis,'дню','дням','дням')+'. Обязательные (постоянные платежи и выбранные категории) в дневную сумму не входят: платежи по расписанию вычитаются в свои дни, остальные учитываются усреднённо.'+(rw.basis<7?' Данных пока мало, оценка грубая.':'')+' Отключённые счета не учитываются.</div>';
  if(rw.gaps.length)h+='<div class="small" style="margin-top:8px"><a data-a="sub" data-v="must" style="color:var(--fx);cursor:pointer">Обязательные траты ('+rw.gaps.map(function(g){return esc(g.cat);}).join(', ')+') пока не заведены как постоянные платежи — как это исправить</a></div>';
  h+='<button class="btn plain sm" data-a="runway" style="margin-right:8px">Подробный разбор</button>';
  if(S.accounts.some(function(a){return a.cur!==main;}))h+='<button class="btn plain sm" data-a="plan">Сколько менять?</button>';
  return h+'</div>';
}

/* Сверка остатков */
function reconCfg(){var r=S.settings.recon||(S.settings.recon={on:true,days:7,accs:{}});if(!r.accs)r.accs={};return r;}
function reconOn(a){var r=reconCfg();return r.accs[a.id]!==undefined?!!r.accs[a.id]:a.type==='cash';}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);}
function reconDue(){
  var r=reconCfg(),t=today(),out=[];
  if(!r.on)return out;
  S.accounts.forEach(function(a){
    if(!a.rc)a.rc=t;
    if(a.excl||!reconOn(a))return;
    if(a.snz&&a.snz>t)return;
    if(daysBetween(a.rc,t)>=r.days)out.push(a);
  });
  return out;
}

/* Прогноз на конец месяца */
function monthEndInfo(){
  var t=today(),ym=t.slice(0,7),dim=new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate(),day=+t.slice(8,10);
  return {ym:ym,dim:dim,day:day,left:dim-day,end:ym+'-'+String(dim).padStart(2,'0')};
}
function forecast(){
  var rw=runway();if(!rw.per.length)return null;
  var me=monthEndInfo(),items=recItems(me.left);
  var per=rw.per.map(function(p){
    var sched=0;items.forEach(function(x){if(x.cur===p.cur)sched+=x.r.amount;});
    var perDay=p.daily+p.unsch,spend=perDay*me.left+sched;
    return {cur:p.cur,bal:p.bal,perDay:perDay,daily:p.daily,sched:sched,spend:spend,end:p.bal-spend};
  });
  var tot=null;
  if(rw.total){
    var schedM=0;items.forEach(function(x){var r=rateToMain(x.cur);if(r!=null)schedM+=x.r.amount*r;});
    var ei=S.settings.expInc,inc=(ei&&ei.ym===me.ym)?ei.amount:0;
    var perDayM=rw.total.daily+rw.total.unsch,spend=perDayM*me.left+schedM;
    tot={bal:rw.total.bal,spend:spend,sched:schedM,daily:rw.total.daily,unsch:rw.total.unsch,perDay:perDayM,inc:inc,end:rw.total.bal-spend+inc,
      room:rw.total.bal+inc-schedM-rw.total.unsch*me.left,avail:me.left>0?(rw.total.bal+inc-schedM-rw.total.unsch*me.left)/me.left:null};
  }
  return {me:me,per:per,total:tot};
}

function recItems(days){
  var t=today(),end=new Date(Date.now()+days*864e5).toISOString().slice(0,10),ym=t.slice(0,7),out=[];
  S.rec.forEach(function(r){
    var a=getAcc(r.acc);if(!a)return;
    for(var i=-1;i<=Math.ceil(days/28)+1;i++){
      var m=shiftMonth(ym,i);if(m<r.created||(r.done&&r.done[m]))continue;
      var d=dueDate(m,r.day);if(d<=end)out.push({r:r,cur:a.cur,date:d});
    }
  });
  return out.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
}
function openRunway(){
  var rw=runway(),main=S.settings.main;
  if(!rw.per.length){openSheet('<h2>На сколько хватит</h2><p class="muted">Пока нет расходов — прогноз появится после первых трат.</p><button class="btn plain" data-a="close">Понятно</button>');return;}

  function block(title,sub,cur,p,its){
    var due=p.sched30+p.unsch30,after=p.bal-due;

    return h+'</div>';
  }

function recCandidates(){
  var from=new Date(Date.now()-90*864e5).toISOString().slice(0,10),m={},must=mustCats();
  function dd(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);}
  S.tx.forEach(function(x){
    if(x.type!=='expense'||x.opening||x.rec||x.date<from||!getAcc(x.acc))return;
    var note=(x.note||'').trim(),k=x.acc+'|'+x.cat+'|'+x.amount+'|'+note.toLowerCase();
    var o=m[k]||(m[k]={acc:x.acc,cat:x.cat,amount:x.amount,note:note,n:0,last:x.date,ids:[],dates:[]});
    o.n++;o.ids.push(x.id);o.dates.push(x.date);if(x.date>o.last)o.last=x.date;
  });
  var all=Object.keys(m).map(function(k){return m[k];}).filter(function(o){
    return !S.rec.some(function(r){return r.acc===o.acc&&r.amount===o.amount&&r.name===(o.note||o.cat);});
  });
  all.forEach(function(o){
    o.dates.sort();var gaps=[];for(var i=1;i<o.dates.length;i++)gaps.push(dd(o.dates[i-1],o.dates[i]));
    o.monthly=gaps.some(function(g){return g>=24&&g<=38;});
    o.frequent=o.n>=3&&(dd(o.dates[0],o.dates[o.n-1])/(o.n-1))<15;
    o.must=must.indexOf(o.cat)>=0;
  });
  var cand=all.filter(function(o){return !o.frequent;});
  var singles=cand.filter(function(o){return !o.monthly&&!o.must;}).sort(function(a,b){return b.amount-a.amount;}).slice(0,5);
  cand=cand.filter(function(o){return o.monthly||o.must;}).concat(singles);
  cand.forEach(function(o){o.rank=o.monthly?0:(o.must?1:2);});
  return cand.sort(function(a,b){return a.rank-b.rank||(a.last<b.last?1:-1);}).slice(0,15);
}
function makeRecFromMatches(name,acc,cat,amount,day,ids,lastYm){
  if(S.rec.some(function(r){return r.acc===acc&&r.amount===amount&&r.name===name;}))return false;
  var done={};
  ids.forEach(function(id){var x=S.tx.filter(function(t){return t.id===id;})[0];if(x){x.rec=true;done[x.date.slice(0,7)]='paid';}});
  S.rec.push({id:uid(),name:name,amount:amount,acc:acc,cat:cat,day:day,done:done,created:lastYm});
  return true;
}

  h+='<div class="card" style="background:var(--bg);border:0;text-align:center"><div id="planOut" style="font:600 24px/1.3 Unbounded,Onest,sans-serif">—</div><div class="hint" id="planSub"></div></div>';

function planUpdate(){
  var out=$('#planOut'),sub=$('#planSub'),btn=$('#planBtn');if(!out)return;
  var main=S.settings.main,cur=F.cur,days=num(F.daysS),daily=num(F.dailyS),buf=num(F.bufS),n=numR(F.rateS);
  if(!(buf>=0))buf=0;F.need=0;btn.hidden=true;sub.className='hint';
  if(!(days>0&&daily>0&&n>0)){out.textContent='—';sub.textContent='Заполни дни, траты в день и курс.';return;}
  var r=WEAK.indexOf(cur)>=0?1/n:n,bal=curBalance(cur);
  var recSum=(F.recOn!==false)?recUpcoming(cur,days):0;
  var need=days*daily*(1+buf/100)+recSum-bal;
  if(need<=0){var cov=runDays(bal,daily,function(dd){return F.recOn!==false?recUpcoming(cur,dd):0;});out.textContent='Менять не нужно';sub.textContent='На счетах '+fmt(bal,cur)+' — с учётом платежей этого хватит примерно на '+fmtDays(cov)+' даже без запаса.';return;}
  var mainNeed=need*r,mainBal=curBalance(main);
  F.need=need;F.needMain=mainNeed;F.r=r;
  out.textContent='≈ '+fmt(mainNeed,main);
  var msg='Получишь ≈ '+fmt(need,cur)+' по курсу '+showRate(cur,r)+'. Вместе с остатком '+fmt(bal,cur)+' хватит на '+days+' '+plural(days,'день','дня','дней')+' с запасом '+buf+'%.'+(recSum>0?' Учтены постоянные платежи: '+fmt(recSum,cur)+'.':'');
  if(mainNeed>mainBal+1e-9){msg+=' На счетах в '+main+' сейчас только '+fmt(mainBal,main)+'.';sub.className='hint warn';}
  sub.textContent=msg;btn.hidden=false;
}
function planExchange(){
  var main=S.settings.main,cur=F.cur,need=F.need,nm=F.needMain;
  if(!(need>0))return;
  closeSheet();
  openOp('exchange');if(!F)return;
  var src=S.accounts.filter(function(a){return a.cur===main;})[0],dst=S.accounts.filter(function(a){return a.cur===cur&&!a.excl;})[0]||S.accounts.filter(function(a){return a.cur===cur;})[0];
  if(src)F.acc=src.id;if(dst)F.to=dst.id;
  F.amountS=inp(Math.ceil(nm));F.toS=inp(Number(need.toFixed(cinfo(cur).d)));
  renderOp();
}

/* Автообновление курсов (работает в установленной версии; в Claude блокируется) */
function getJson(url){return fetch(url).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();});}
function refreshMarket(){
  var mk=Object.assign({},(S.mkt&&S.mkt.rub)||{});mk.RUB=1;
  return getJson('https://open.er-api.com/v6/latest/USD').then(function(j){
    var r=j.rates||{};if(!(r.RUB>0))throw new Error('no RUB');
    Object.keys(r).forEach(function(k){if(r[k]>0)mk[k]=r.RUB/r[k];});
    mk.RUB=1;mk.USD=r.RUB;return true;
  }).catch(function(){return false;}).then(function(fiatOk){
    var usd=mk.USD>0?mk.USD:(S.auto&&S.auto.rub&&S.auto.rub.USD);
    var ids=[],map={};
    favCurs().forEach(function(c){if(CG[c]&&!map[CG[c]]){ids.push(CG[c]);map[CG[c]]=c;}});
    if(!ids.length||!(usd>0))return {fiatOk:fiatOk,cryptoOk:null};
    if(!(mk.USD>0))mk.USD=usd;
    return getJson('https://api.coingecko.com/api/v3/simple/price?ids='+ids.join(',')+'&vs_currencies=usd').then(function(j){
      Object.keys(j).forEach(function(id){var u=j[id]&&j[id].usd;if(u>0&&map[id])mk[map[id]]=u*usd;});
      return {fiatOk:fiatOk,cryptoOk:true};
    }).catch(function(){return {fiatOk:fiatOk,cryptoOk:false};});
  }).then(function(res){
    if(res.fiatOk||res.cryptoOk)S.mkt={date:today(),ts:Date.now(),rub:mk};
    return res;
  });
}
function refreshRates(manual){
  if(typeof fetch!=='function'){if(manual)toast('Обновление курсов доступно в установленной версии');return Promise.resolve();}
  var p1=getJson('https://www.cbr-xml-daily.ru/daily_json.js').then(function(j){
    var rub={RUB:1};Object.keys(j.Valute).forEach(function(k){var v=j.Valute[k];rub[k]=v.Value/v.Nominal;});
    S.auto={date:String(j.Date).slice(0,10),src:'ЦБ РФ',rub:rub};return true;
  }).catch(function(){return false;});
  return Promise.all([p1,refreshMarket()]).then(function(rs){
    save();C=compute();render();
    if(manual)toast(rs[0]||rs[1].fiatOk||rs[1].cryptoOk?'Курсы обновлены':'Не удалось обновить — работаю на сохранённых курсах');
  });
}
function askPersist(){
  try{
    if(navigator.storage&&navigator.storage.persist){
      navigator.storage.persisted().then(function(p){
        if(p){persisted=true;return;}
        return navigator.storage.persist().then(function(ok){persisted=ok;});
      }).catch(function(){});
    }
  }catch(e){}
}
