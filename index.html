<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16202B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192-v2.png">
<link rel="apple-touch-icon" href="icon-192-v2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lucky Finance">
<title>Lucky Finance</title>
<meta name="description" content="Личный учёт денег для тех, кто получает в одной валюте, а тратит в другой. Считает траты по курсу, по которому деньги обменяны на самом деле.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDF1; --surface:#FFFFFF; --ink:#16202B; --muted:#87929B; --line:#D5DDE3;
  --income:#17805A; --income-soft:#DDF1E8;
  --expense:#CF3E36; --expense-soft:#F9E1DF;
  --fx:#2C52D0; --fx-soft:#E1E8FB; --gold:#B8860B; --gold-soft:#FBF1D0;
  --hero:#16202B; --hero-ink:#F2F5F7; --hero-muted:#9BAAB6;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --cother:#A9B3BB;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151D; --surface:#17212C; --ink:#E6EDF3; --muted:#6C7A87; --line:#263341;
    --income:#3FBF8C; --income-soft:#173A2E;
    --expense:#F0726A; --expense-soft:#41211F;
    --fx:#7E9CFF; --fx-soft:#1E2A4D; --gold:#E6C25A; --gold-soft:#3A3117;
    --hero:#1F2C3A; --hero-ink:#F2F5F7; --hero-muted:#9BAAB6;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --cother:#56636F;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151D; --surface:#17212C; --ink:#E6EDF3; --muted:#6C7A87; --line:#263341;
  --income:#3FBF8C; --income-soft:#173A2E;
  --expense:#F0726A; --expense-soft:#41211F;
  --fx:#7E9CFF; --fx-soft:#1E2A4D; --gold:#E6C25A; --gold-soft:#3A3117;
  --hero:#1F2C3A; --hero-ink:#F2F5F7; --hero-muted:#9BAAB6;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --cother:#56636F;
}
/* Цветные темы: всегда в своём виде (светлом или тёмном), поэтому идут после блоков тёмной темы и перекрывают их */
:root[data-pal="emerald"]{--bg:#E4F1EA;--surface:#FFFFFF;--ink:#0F2A1F;--muted:#5E7A6C;--line:#CFE3D7;--income:#138A55;--income-soft:#D3F1E2;--expense:#C8452F;--expense-soft:#F8E0D9;--fx:#0F7A57;--fx-soft:#D6EFE4;--gold:#C08A10;--gold-soft:#FBEFC8;--hero:#0B5D3E;--hero-ink:#F4FFF8;--hero-muted:#A9D5BE;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--cother:#A9B3BB;--hero-bg:linear-gradient(135deg,#0B5D3E 0%,#13895A 55%,#2FB57A 100%);--hero-shadow:0 12px 30px -14px #0B5D3E;color-scheme:light}
:root[data-pal="sunset"]{--bg:#FFF1E8;--surface:#FFFFFF;--ink:#2B1530;--muted:#8C6E78;--line:#F3D9CB;--income:#16825B;--income-soft:#DDF3E8;--expense:#D93B4A;--expense-soft:#FCE0E2;--fx:#7B3FD9;--fx-soft:#EEE3FC;--gold:#E08A00;--gold-soft:#FFEBC2;--hero:#C9406A;--hero-ink:#FFFFFF;--hero-muted:#FFE0D2;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--cother:#A9B3BB;--hero-bg:linear-gradient(135deg,#FF7A59 0%,#F0457A 50%,#8E3FD9 100%);--hero-shadow:0 12px 30px -14px #C9406A;color-scheme:light}
:root[data-pal="ocean"]{--bg:#E3F4F8;--surface:#FFFFFF;--ink:#0B2433;--muted:#5D7C8A;--line:#CBE5EC;--income:#11845E;--income-soft:#D5F1E6;--expense:#D9473B;--expense-soft:#FBE1DE;--fx:#0A7FB5;--fx-soft:#D6EDF8;--gold:#C98F00;--gold-soft:#FFF0C7;--hero:#0A6AA0;--hero-ink:#FFFFFF;--hero-muted:#CDEFF8;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--cother:#A9B3BB;--hero-bg:linear-gradient(135deg,#0A4F8C 0%,#0A86B5 55%,#19C2C7 100%);--hero-shadow:0 12px 30px -14px #0A6AA0;color-scheme:light}
:root[data-pal="neon"]{--bg:#0D0B1A;--surface:#171430;--ink:#ECE8FF;--muted:#8D86B5;--line:#2B2650;--income:#3EF0A9;--income-soft:#123A30;--expense:#FF5C8A;--expense-soft:#3D1730;--fx:#7C6CFF;--fx-soft:#251F55;--gold:#FFC94A;--gold-soft:#3A2E12;--hero:#5B25C9;--hero-ink:#FFFFFF;--hero-muted:#C9C2FF;--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--cother:#56636F;--hero-bg:linear-gradient(135deg,#3A1C9C 0%,#7B2FF7 50%,#F72FA1 100%);--hero-shadow:0 12px 30px -14px #5B25C9;color-scheme:dark}
:root[data-pal="lavender"]{--bg:#F1EEFB;--surface:#FFFFFF;--ink:#221B3A;--muted:#7C7499;--line:#E1DBF4;--income:#178A62;--income-soft:#DDF3EA;--expense:#D2456A;--expense-soft:#FBE2EA;--fx:#6A4FD8;--fx-soft:#E8E2FB;--gold:#C7900E;--gold-soft:#FCEFCB;--hero:#6A4FD8;--hero-ink:#FFFFFF;--hero-muted:#E2DAFF;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--cother:#A9B3BB;--hero-bg:linear-gradient(135deg,#5B3FD1 0%,#8B6BEA 55%,#C79BF2 100%);--hero-shadow:0 12px 30px -14px #6A4FD8;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:480px;margin:0 auto;padding:18px 16px 130px}
h1{font:600 20px/1.2 'Unbounded','Onest',system-ui,sans-serif;margin:4px 0 14px;letter-spacing:-.01em}
h2{font:600 18px/1.2 'Unbounded','Onest',system-ui,sans-serif;margin:0 0 4px}
h3{font-size:14px;font-weight:600;margin:0 0 10px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.num{font-variant-numeric:tabular-nums}

/* Balance card */
.pals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pal{background:none;border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink)}
.pal i{display:block;width:100%;height:34px;border-radius:9px}
.pal.on{border-color:var(--fx);box-shadow:inset 0 0 0 1px var(--fx)}
.qod{margin:-6px 2px 12px;font-size:13px;line-height:1.45;color:var(--muted)}
.qod q{font-style:italic;color:var(--ink);opacity:.8;quotes:'«' '»'}
.qod span{white-space:nowrap}
.hero{background:var(--hero-bg,var(--hero));box-shadow:var(--hero-shadow,none);color:var(--hero-ink);border-radius:26px;padding:22px 20px 20px;cursor:pointer;position:relative;overflow:hidden;user-select:none}
.hero .lbl{font-size:13px;color:var(--hero-muted)}
.hero .big{font:600 32px/1.15 'Unbounded','Onest',system-ui,sans-serif;margin:8px 0 6px;letter-spacing:-.02em;transition:filter .3s}
.hero:not(.open) .big{filter:blur(13px)}
.hero .tap{font-size:12px;color:var(--hero-muted)}
.hero .miss{font-size:12px;color:var(--hero-muted);margin-top:6px}
.hero .more{background:none;border:0;padding:2px 0;font-size:12px;color:var(--hero-muted);display:inline-flex;align-items:center;gap:4px}
.hero .more .warnc{color:#F0A33A}

/* Quick actions */
.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.calcbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px;display:grid;place-items:center;padding:0;opacity:.75}
.qa{background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500}
.qa i{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font:600 22px/1 'Onest',sans-serif;font-style:normal}
.qa .g{background:var(--income-soft);color:var(--income)}
.qa .r{background:var(--expense-soft);color:var(--expense)}
.qa .b{background:var(--fx-soft);color:var(--fx)}

/* Lists */
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.item:first-child{border-top:0}
.ic{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:18px;background:var(--bg)}
.ic.income{background:var(--income-soft)} .ic.expense{background:var(--expense-soft)} .ic.exchange,.ic.transfer{background:var(--fx-soft);color:var(--fx);font-weight:600}
.grow{flex:1;min-width:0}
.t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{text-align:right;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.amt small{display:block;white-space:normal;max-width:190px;margin-left:auto;font-weight:400;font-size:12px;color:var(--muted)}
.pos{color:var(--income)} .neg{color:var(--expense)} .fx{color:var(--fx)}
.grp{font-size:13px;font-weight:600;color:var(--muted);margin:20px 4px 2px}
.bar{height:6px;border-radius:3px;background:var(--bg);margin-top:6px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--expense);border-radius:3px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

/* Chips & segments */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chip.sm{padding:6px 10px;font-size:13px;flex:none}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 0}
.seg button{padding:10px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.seg button.on.income{background:var(--income-soft);border-color:var(--income);color:var(--income)}
.seg button.on.expense{background:var(--expense-soft);border-color:var(--expense);color:var(--expense)}
.seg button.on.exchange,.seg button.on.transfer{background:var(--fx-soft);border-color:var(--fx);color:var(--fx)}

/* Forms */
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 0}
input,select,textarea{width:100%;margin-top:6px;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;appearance:none;-webkit-appearance:none}
textarea{min-height:110px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--fx);outline-offset:1px}
.amtwrap{position:relative}
.amtwrap input{padding-right:64px;font-weight:600;font-size:20px}
.amtwrap span{position:absolute;right:14px;top:50%;transform:translateY(-38%);color:var(--muted);font-weight:600}
.hint{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px}
.warn{color:var(--expense)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;font-weight:600;font-size:16px;background:var(--fx);color:#fff;margin-top:18px}
.btn.income{background:var(--income)} .btn.expense{background:var(--expense)}
.btn.ghost{background:transparent;color:var(--expense);border:1px solid var(--line)}
.btn.plain{background:var(--bg);color:var(--ink)}
.btn.sm{display:inline-block;width:auto;padding:10px 16px;font-size:14px;margin-top:10px;border-radius:12px}

/* Nav & FAB */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:500}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink)}
nav button.on svg{stroke:var(--fx)}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(10,16,22,.5)}
.sheet{position:relative;width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
#toast.show{opacity:1}
#toast.act{pointer-events:auto;width:min(88vw,340px)}
#toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;margin-left:12px;padding:4px 0}

.vc{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.vc button{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px;font-weight:500}
.vc button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vc button.pk{border-style:dashed;margin-left:auto}
.hero .vc button{border-color:rgba(255,255,255,.25);background:transparent;color:var(--hero-ink)}
.hero .vc button.on{background:var(--hero-ink);color:var(--hero);border-color:var(--hero-ink)}
.ic.save,.ic.unsave{background:var(--fx-soft)}
.pbar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.pbar b{display:block;height:100%;background:var(--income);border-radius:5px}
.pbar.gold b{background:var(--gold)}
.card.gold{border-color:var(--gold);background:var(--gold-soft)}
.cols{display:flex;align-items:flex-end;gap:10px;height:110px;margin-top:8px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:11px;color:var(--muted)}
.col .pair{display:flex;align-items:flex-end;gap:3px;height:88px;width:100%;justify-content:center}
.col .pair i{display:block;width:40%;max-width:14px;border-radius:4px 4px 0 0;min-height:2px}
.col .pair .a{background:var(--income)} .col .pair .b{background:var(--expense)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.sw{flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--income)}
.sw.on::after{transform:translateX(18px)}
.pbar.warn b{background:var(--gold)}
.pbar.over b{background:var(--expense)}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px;display:grid;place-items:center;padding:0;flex:none}
.ib.on{border-color:var(--fx);background:var(--fx-soft)}

.sheet-head{position:sticky;top:0;z-index:3;background:var(--surface);margin:0 -20px 4px;padding:10px 20px 8px;display:flex;justify-content:center;align-items:center;border-radius:24px 24px 0 0}
.sheet-x{position:absolute;right:16px;top:8px;width:30px;height:30px;border-radius:50%;background:var(--bg);color:var(--muted);border:0;font-size:15px;display:grid;place-items:center;padding:0}
.backbar{position:sticky;top:0;z-index:4;background:var(--bg);margin:0 -16px 10px;padding:10px 16px 6px}
.amtflex{display:flex;gap:8px}
.k000{flex:none;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;color:var(--ink)}
.catpop{position:relative}
.ib.plus{font-size:22px;line-height:1}
.catgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:4px}
.catgrid button{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 0;font-size:20px}
.catgrid button.on{border-color:var(--fx);background:var(--fx-soft)}
#kbhide{position:fixed;right:16px;bottom:16px;z-index:50;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);border:0;display:none;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.28)}
#kbhide.show{display:grid}
.donut{position:relative;width:132px;height:132px;flex:none}
.donut svg{width:100%;height:100%;display:block}
.donut .dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--muted);padding:0 22px}
.donut .dc b{font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;flex:none}
.lg{display:flex;align-items:center;gap:6px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:var(--ink)}
.lg:first-child{border-top:0}
.pulse{position:relative;display:flex;align-items:flex-end;gap:2px;height:96px;margin-top:22px}
.pulse button{flex:1;height:100%;display:flex;align-items:flex-end;background:none;border:0;padding:0;min-width:0}
.pulse button i{display:block;width:100%;background:var(--expense);border-radius:3px 3px 0 0;min-height:0}
.pulse button.fut i{background:var(--line)}
.pulse .ln{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);pointer-events:none}
.pulse .ln.lim{border-top:2px solid var(--gold)}
.pulse .ln span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--muted);background:var(--surface);padding:0 4px}
.pulse .ln.lim span{color:var(--gold)}
.dpbtn{width:100%;margin-top:6px;padding:12px 14px;font-size:16px;text-align:left;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.dpbtn::after{content:'📅';font-size:15px}
.dpq{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dpcal{margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.dpcal .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:600}
.dpcal .hd button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;padding:0}
.dpcal .gr{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dpcal .wd{font-size:11px;color:var(--muted);padding:2px 0}
.dpcal .d{height:38px;border-radius:10px;border:0;background:none;font-size:15px;color:var(--ink);padding:0;font-variant-numeric:tabular-nums}
.dpcal .d.t{box-shadow:inset 0 0 0 1px var(--fx)}
.dpcal .d.on{background:var(--fx);color:#fff}

  if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');
  else{
    var d=(s.match(/\./g)||[]).length;
    if(d>1)s=s.replace(/\./g,'');
    else if(d===1){var q=s.split('.');if(q[1].length===3&&!/^0*$/.test(q[0]))s=q[0]+q[1];}
  }
  var x=parseFloat(s);return isFinite(x)?x:NaN;
}
function numR(v){var x=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(x)?x:NaN;}
function grp(ip){return ip.replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function inp(n){
  if(n==null||n==='')return '';var x=Number(n);if(!isFinite(x))return '';
  var neg=x<0;x=Math.abs(x);var s=String(x);
  if(/e/i.test(s))s=x.toFixed(8).replace(/0+$/,'').replace(/\.$/,'');
  var p=s.split('.');return (neg?'-':'')+grp(p[0])+(p[1]?','+p[1]:'');
}

/* Живое форматирование суммы: 1.234.567,89 (точка — тысячи, запятая — дробь) */
function fmtField(el,e){
  var raw=el.value,pos=el.selectionStart,it=(e&&e.inputType)||'',typed=(e&&typeof e.data==='string'&&e.data.length===1)?e.data:'';
  if(pos==null||pos>raw.length)pos=raw.length;
  if(it==='deleteContentBackward'&&el.__pv&&el.__pv.length===raw.length+1&&el.__pv.charAt(pos)==='.'&&pos>0){raw=raw.slice(0,pos-1)+raw.slice(pos);pos--;}
  var ip,dec=null,cnt,di;
  var heur=(it==='insertFromPaste'||it==='insertCompositionText'||it==='insertReplacementText'||(it==='insertText'&&e&&typeof e.data==='string'&&e.data.length>1));
  if(heur){
    var t=raw.replace(/[^\d.,]/g,''),lc=t.lastIndexOf(','),ld=t.lastIndexOf('.');di=-1;
    if(lc>=0&&ld>=0)di=Math.max(lc,ld);
    else if(lc>=0)di=(t.split(',').length===2)?lc:-1;
    else if(ld>=0)di=(t.split('.').length===2&&t.length-ld-1<=2)?ld:-1;
    if(di>=0){ip=t.slice(0,di).replace(/[.,]/g,'');dec=t.slice(di+1).replace(/[.,]/g,'');}else ip=t.replace(/[.,]/g,'');
    cnt=null;
  }else{
    var s2=raw,lead;
    if((typed==='.'||typed===',')&&pos>0){
      s2=raw.slice(0,pos-1)+'#'+raw.slice(pos);
      if(s2.replace('#','').indexOf(',')>=0){s2=raw.slice(0,pos-1)+raw.slice(pos);lead=raw.slice(0,pos-1);}else lead=s2.slice(0,pos);
    }else lead=raw.slice(0,pos);
    cnt=(lead.match(/[\d,#]/g)||[]).length;
    s2=s2.replace(/[^\d,#]/g,'');
    di=s2.search(/[#,]/);
    if(di>=0){ip=s2.slice(0,di);dec=s2.slice(di+1).replace(/[#,]/g,'');}else ip=s2;
  }
  ip=ip.replace(/^0+(?=\d)/,'');
  if(ip===''&&dec!==null){ip='0';if(cnt!==null)cnt++;}
  var out=grp(ip)+(dec!==null?','+dec:'');
  if(out!==el.value)el.value=out;
  el.__pv=out;
  var np=out.length;
  if(cnt!==null){var c=0;np=0;while(np<out.length&&c<cnt){if(/[\d,]/.test(out.charAt(np)))c++;np++;}}
  try{el.setSelectionRange(np,np);}catch(err){}
}

/* ---------- Расчёт: воспроизводим все операции по порядку (FIFO) ---------- */
var RATE_CACHE={},RW_CACHE=null;
function compute(){
  RATE_CACHE={};RW_CACHE=null;
  var main=S.settings.main,accs={},info={},pairs={},sav={};
  function svAcc(cur){return sav[cur]||(sav[cur]={bal:0,lots:[],cur:cur});}
  S.accounts.forEach(function(a){accs[a.id]={bal:0,lots:[],cur:a.cur};});
  function consume(A,amount){
    var parts=[],need=amount;
    if(A.cur===main)return {parts:parts,lack:0};
    while(need>1e-9&&A.lots.length){
      var l=A.lots[0],take=Math.min(l.amt,need);
      parts.push({amt:take,rate:l.rate,src:l.src,est:l.est,date:l.date});
      l.amt-=take;need-=take;if(l.amt<=1e-9)A.lots.shift();
    }
    return {parts:parts,lack:need>1e-9?need:0};
  }
  function costOf(parts,lack){
    var cost=0,unknown=lack,est=0;
    parts.forEach(function(p){if(p.src===main&&p.rate!=null){cost+=p.amt*p.rate;if(p.est)est+=p.amt;}else unknown+=p.amt;});
    return {cost:cost,unknown:unknown,est:est};
  }
  S.tx.slice().sort(cmp).forEach(function(t){
    if(t.type==='svadj'){
      var Vadj=svAcc(t.cur);
      Vadj.bal+=t.amount;
      if(t.cur!==main){
        if(t.amount>0){
          var ra=t.rateMain>0?t.rateMain:null,esta=false;
          if(ra==null){var fra=rateExt(t.cur).r;if(fra!=null){ra=fra;esta=true;}}
          Vadj.lots.push({amt:t.amount,rate:ra,src:ra?main:null,est:esta,date:t.date});
        }else{
          var needa=-t.amount;
          while(needa>1e-9&&Vadj.lots.length){var la=Vadj.lots[0],takea=Math.min(la.amt,needa);la.amt-=takea;needa-=takea;if(la.amt<=1e-9)Vadj.lots.shift();}
        }
      }
      return;
    }
    var A=accs[t.acc];if(!A)return;
    if(t.type==='income'){
      A.bal+=t.amount;
      if(A.cur!==main){var r=t.rateMain>0?t.rateMain:null,est=false;if(r==null){var fr=rateExt(A.cur).r;if(fr!=null){r=fr;est=true;}}A.lots.push({amt:t.amount,rate:r,src:r?main:null,est:est,date:t.date});}
    }else if(t.type==='expense'){
      A.bal-=t.amount;
      if(A.cur!==main){var c=consume(A,t.amount);info[t.id]=costOf(c.parts,c.lack);}
    }else if(t.type==='transfer'){
      var B=accs[t.to];if(!B)return;
      A.bal-=t.amount;B.bal+=t.amount;
      if(A.cur!==main){
        var c2=consume(A,t.amount);
        c2.parts.forEach(function(p){B.lots.push({amt:p.amt,rate:p.rate,src:p.src,est:p.est,date:p.date});});
        if(c2.lack>0)B.lots.push({amt:c2.lack,rate:null,src:null,date:t.date});
      }
    }else if(t.type==='exchange'){
      var B2=accs[t.to];if(!B2)return;
      A.bal-=t.amount;B2.bal+=t.toAmount;
      var rate,src,estF=false;
      if(A.cur===main){rate=t.amount/t.toAmount;src=main;}
      else{
        var c3=consume(A,t.amount),k=costOf(c3.parts,c3.lack);
        if(k.unknown<=1e-9){rate=k.cost/t.toAmount;src=main;estF=k.est>1e-9;}else{rate=t.amount/t.toAmount;src=A.cur;}
      }
      if(B2.cur!==main)B2.lots.push({amt:t.toAmount,rate:rate,src:src,est:estF,date:t.date});
      var key=A.cur+'>'+B2.cur;
      var p=pairs[key]||(pairs[key]={from:A.cur,to:B2.cur,given:0,got:0});
      p.given+=t.amount;p.got+=t.toAmount;
    }else if(t.type==='save'){
      var V=svAcc(A.cur);A.bal-=t.amount;V.bal+=t.amount;
      if(A.cur!==main){
        var c4=consume(A,t.amount);
        c4.parts.forEach(function(p2){V.lots.push({amt:p2.amt,rate:p2.rate,src:p2.src,est:p2.est,date:p2.date});});
        if(c4.lack>0)V.lots.push({amt:c4.lack,rate:null,src:null,date:t.date});
      }
    }else if(t.type==='unsave'){
      var V2=svAcc(A.cur);A.bal+=t.amount;V2.bal-=t.amount;
      if(A.cur!==main){
        var c5=consume(V2,t.amount);
        c5.parts.forEach(function(p3){A.lots.push({amt:p3.amt,rate:p3.rate,src:p3.src,est:p3.est,date:p3.date});});
        if(c5.lack>0)A.lots.push({amt:c5.lack,rate:null,src:null,date:t.date});
      }
    }
  });
  return {accs:accs,info:info,pairs:pairs,sav:sav};
}
function simulate(accId,amount){
  var a=getAcc(accId),main=S.settings.main;if(!a||a.cur===main||!C.accs[accId])return null;
  var need=amount,cost=0,unknown=0,est=0;
  C.accs[accId].lots.forEach(function(l){
    if(need<=1e-9)return;var take=Math.min(l.amt,need);
    if(l.src===main&&l.rate!=null){cost+=take*l.rate;if(l.est)est+=take;}else unknown+=take;need-=take;
  });
  if(need>1e-9)unknown+=need;
  return {cost:cost,unknown:unknown,est:est};
}
function tblRate(t,c){
  if(!t||!t.rub)return null;var v=t.rub[c];
  if(!(v>0)&&(c==='USDT'||c==='USDC'))v=t.rub.USD;
  return v>0?v:null;
}
function autoRate(cur){
  var main=S.settings.main,tabs=[S.mkt,S.auto];
  for(var i=0;i<tabs.length;i++){
    var c=tblRate(tabs[i],cur),m=tblRate(tabs[i],main);
    if(c&&m)return {r:c/m,mkt:i===0};
  }
  return null;
}
/* Курс без FIFO: заданный вручную → рыночный → ЦБ. Его же берёт compute() для денег без известного курса */
function rateExt(cur){
  var main=S.settings.main;if(cur===main)return {r:1,src:''};
  var m=S.settings.rates[cur];if(m>0)return {r:m,src:'заданный тобой вручную'};
  var au=autoRate(cur);
  if(au)return {r:au.r,src:au.mkt?'рыночный курс на '+dshort(S.mkt.date):'ЦБ РФ на '+dshort(S.auto.date)};
  return {r:null,src:''};
}
/* Средний курс денег, которые сейчас лежат в этой валюте (счета и накопления), по партиям FIFO */
function fifoRate(cur){
  if(!C)return null;var main=S.settings.main,amt=0,cost=0;
  function add(lots){lots.forEach(function(l){if(l.src===main&&l.rate!=null&&!l.est){amt+=l.amt;cost+=l.amt*l.rate;}});}
  Object.keys(C.accs).forEach(function(id){if(C.accs[id].cur===cur)add(C.accs[id].lots);});
  if(C.sav[cur])add(C.sav[cur].lots);
  return amt>1e-9?cost/amt:null;
}
/* Курс для пересчёта в основную валюту: 1) по FIFO, 2) заданный вручную, 3) рыночный, 4) ЦБ */
function rateInfo(cur){
  var main=S.settings.main;if(cur===main)return {r:1,src:''};
  var f=fifoRate(cur);if(f)return {r:f,src:'по FIFO — средний курс твоих денег'};
  return rateExt(cur);
}
function rateToMain(cur){return rateInfoC(cur).r;}
/* rateInfo перебирает все обмены — кешируем до следующего compute() */
function rateInfoC(cur){return RATE_CACHE[cur]||(RATE_CACHE[cur]=rateInfo(cur));}
function txToMain(t){
  var a=getAcc(t.acc);if(!a)return null;var main=S.settings.main;
  if(a.cur===main)return t.amount;
  if(t.type==='income'&&t.rateMain>0)return t.amount*t.rateMain;
  var i=C.info[t.id];if(t.type==='expense'&&i&&i.unknown<1e-9)return i.cost;
  var r=rateToMain(a.cur);return r==null?null:t.amount*r;
}
function holdings(){
  var main=S.settings.main,h={};
  S.accounts.forEach(function(a){
    if(a.cur===main)return;
    var x=h[a.cur]||(h[a.cur]={cur:a.cur,bal:0,known:0,cost:0,unk:0,est:0});
    x.bal+=C.accs[a.id].bal;
    C.accs[a.id].lots.forEach(function(l){if(l.src===main&&l.rate!=null){x.known+=l.amt;x.cost+=l.amt*l.rate;if(l.est)x.est+=l.amt;}else x.unk+=l.amt;});
  });
  return Object.keys(h).map(function(k){return h[k];}).filter(function(x){return Math.abs(x.bal)>1e-9;});
}

function opsFiltered(){
  var f=nav.filter,q=(nav.q||'').trim().toLowerCase(),per=nav.per||'all',t0=today(),cur=t0.slice(0,7),prev=shiftMonth(cur,-1),from=null,to=null;
  if(per==='month'){from=cur+'-01';to=cur+'-31';}
  else if(per==='prev'){from=prev+'-01';to=prev+'-31';}
  else if(per==='30'){from=new Date(Date.now()-new Date().getTimezoneOffset()*60000-29*864e5).toISOString().slice(0,10);to='9999-12-31';}
  else if(per==='year'){from=t0.slice(0,4)+'-01-01';to=t0.slice(0,4)+'-12-31';}
  else if(per==='day'){from=to=nav.pday||t0;}
  else if(per==='ym'){from=(nav.pym||cur)+'-01';to=(nav.pym||cur)+'-31';}
  var TL={income:'доход',expense:'расход',transfer:'перевод',exchange:'обмен',save:'накопления',unsave:'накопления'};
  return S.tx.filter(function(t){
    if(!(f==='all'||t.type===f||(f==='save'&&(t.type==='unsave'||t.type==='svadj'))))return false;
    if(from&&(t.date<from||t.date>to))return false;
    if(nav.facc&&t.acc!==nav.facc&&t.to!==nav.facc)return false;
    if(nav.fcat&&t.cat!==nav.fcat)return false;
    if(q){
      var a=getAcc(t.acc),b=t.to?getAcc(t.to):null;
      var hay=((t.cat||'')+' '+(t.sub||'')+' '+(t.note||'')+' '+(a?a.name:'')+' '+(b?b.name:'')+' '+t.amount+' '+(t.toAmount||'')+' '+(TL[t.type]||'')).toLowerCase();
      if(hay.indexOf(q)<0)return false;
    }
    return true;
  }).sort(cmp).reverse();
}
function dayExpenseSum(d){
  var sum=0;S.tx.forEach(function(t){if(t.type==='expense'&&!t.opening&&t.date===d){var v=txToMain(t);if(v!=null)sum+=v;}});
  return sum;
}

function dec(n){return String(n).replace('.',',');}
function csvCell(v){v=String(v==null?'':v);return /[";\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function csvOps(list){
  var TL={income:'Доход',expense:'Расход',transfer:'Перевод',exchange:'Обмен',save:'В накопления',unsave:'Из накоплений',svadj:'Корректировка накоплений'};
  var rows=[['Дата','Тип','Категория','Счёт','Сумма','Валюта','Счёт назначения','Получено','Валюта получения','Заметка']];
  list.slice().reverse().forEach(function(t){
    if(t.type==='svadj'){rows.push([t.date,TL.svadj,'','',dec(t.amount),t.cur,'','','',t.note||'']);return;}
    var a=getAcc(t.acc),b=t.to?getAcc(t.to):null;
    rows.push([t.date,TL[t.type]||t.type,t.cat?catTitle(t):'',a?a.name:'',dec(t.amount),a?a.cur:'',b?b.name:'',t.type==='exchange'?dec(t.toAmount):'',b&&t.type==='exchange'?b.cur:'',t.note||'']);
  });
  return '\ufeff'+rows.map(function(r){return r.map(csvCell).join(';');}).join('\r\n');
}

/* Накопления по валютам. val — во сколько они обошлись по FIFO (партии накоплений с известным курсом,
   остаток — по общему курсу валюты); mkt — сколько стоят сегодня по рыночному курсу (или ЦБ) */
function savingsTotal(){
  var main=S.settings.main,sum=0,mktSum=0,mktAll=true,miss=[],per=[];
  Object.keys(C.sav).forEach(function(c){
    var V=C.sav[c],b=V.bal;if(Math.abs(b)<1e-9)return;
    var val=null,mkt=null;
    if(c===main){val=mkt=b;}
    else{
      var known=0,cost=0;V.lots.forEach(function(l){if(l.src===main&&l.rate!=null){known+=l.amt;cost+=l.amt*l.rate;}});
      var r=rateToMain(c),rest=b-known;
      if(rest<=1e-9)val=cost*(b/(known||b));else if(r!=null)val=cost+rest*r;
      var au=autoRate(c);if(au)mkt=b*au.r;
    }
    per.push({cur:c,bal:b,val:val,mkt:mkt});
    if(val==null)miss.push(c);else sum+=val;
    if(mkt==null)mktAll=false;else mktSum+=mkt;
  });
  var foreign=per.some(function(p){return p.cur!==main;});
  return {sum:sum,miss:miss,per:per,mkt:foreign&&mktAll?mktSum:null};
}

/* «Пульс месяца»: расходы по дням, средняя в день и лимит в день */
function pulseCard(ym){
  var main=S.settings.main,dim=new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate(),t=today(),day={},sum=0,n=0,i;
  var oneoff=0;S.tx.forEach(function(x){if(x.type!=='expense'||x.opening||x.date.slice(0,7)!==ym)return;var v=txToMain(x);if(v==null)return;var d=+x.date.slice(8,10);day[d]=(day[d]||0)+v;sum+=v;if(isOneOff(x))oneoff+=v;});
  var last=ym===t.slice(0,7)?+t.slice(8,10):dim;if(!sum)return '';
  var avg=(sum-oneoff)/last,l=limits(),lim=l.total>0?l.total/dim:0,vs=[];
  for(i=1;i<=last;i++)vs.push(day[i]||0);vs.sort(function(a,b){return a-b;});

  var mx=Math.max(avg*1.6,lim*1.25,vs[Math.floor((vs.length-1)*0.9)]*1.2,vs[vs.length-1]<=avg*3?vs[vs.length-1]:0);

  for(i=1;i<=dim;i++){

  }

  if(lim>0)h+='<div class="ln lim" style="bottom:'+(lim/mx*100)+'%"><span>лимит '+fmt(lim,main)+'/день</span></div>';
  h+='</div><div class="row small muted" style="margin-top:4px"><span>1</span><span>'+Math.ceil(dim/2)+'</span><span>'+dim+'</span></div>';
  var top=0,td='';for(i=1;i<=last;i++)if((day[i]||0)>top){top=day[i];td=ym+'-'+String(i).padStart(2,'0');}
  h+='<div class="small" style="margin-top:6px">Самый дорогой день — '+dshort(td)+': '+fmt(top,main)+'</div>';
  return h+'</div>';

function delta(a,b,expense,label){

  return '<small class="'+(bad?'neg':'pos')+'">'+(up?'+':'−')+Math.abs(p)+'% '+label+'</small>';
}

function applyBalanceDelta(accBal,svBal,t){
  if(t.type==='income'){accBal[t.acc]=(accBal[t.acc]||0)+t.amount;}
  else if(t.type==='expense'){accBal[t.acc]=(accBal[t.acc]||0)-t.amount;}
  else if(t.type==='transfer'){accBal[t.acc]=(accBal[t.acc]||0)-t.amount;accBal[t.to]=(accBal[t.to]||0)+t.amount;}
  else if(t.type==='exchange'){accBal[t.acc]=(accBal[t.acc]||0)-t.amount;accBal[t.to]=(accBal[t.to]||0)+t.toAmount;}
  else if(t.type==='save'){accBal[t.acc]=(accBal[t.acc]||0)-t.amount;var a=getAcc(t.acc);if(a)svBal[a.cur]=(svBal[a.cur]||0)+t.amount;}
  else if(t.type==='unsave'){accBal[t.acc]=(accBal[t.acc]||0)+t.amount;var a2=getAcc(t.acc);if(a2)svBal[a2.cur]=(svBal[a2.cur]||0)-t.amount;}
  else if(t.type==='svadj'){svBal[t.cur]=(svBal[t.cur]||0)+t.amount;}
}
function capitalAt(cutoff){

  var main=S.settings.main,total=0,missing=false;
  S.accounts.forEach(function(a){
    if(a.excl)return;
    var b=accBal[a.id]||0;

}

  var f='https://'+date+'.currency-api.pages.dev/v1/currencies/usd.min.json';

    var r=j.usd||{};if(!(r.rub>0))throw new Error('нет курса рубля');
    var need={};S.accounts.forEach(function(a){need[a.cur]=1;});need.USD=1;need[S.settings.main]=1;
    var out={RUB:1};Object.keys(need).forEach(function(c){var v=r[c.toLowerCase()];if(v>0)out[c]=r.rub/v;});

function mkHint(){
  var el=$('#mkhint2');if(!el||!F)return;var p=[],nm=((F.note||'').trim()||F.cat||'расход');

function updateHint(){
  mkHint();
  var el=$('#hint');if(!el||!F)return;
  var A=getAcc(F.acc);if(!A){el.innerHTML='';return;}
  var x=num(F.amountS),y=num(F.toS),main=S.settings.main,s='',bal=C.accs[A.id]?C.accs[A.id].bal:0;
  if(F.type!=='income'&&!F.edit&&x>0&&x>bal+1e-9)s+='<span class="warn">Больше, чем на счёте ('+fmt(bal,A.cur)+'). Проверь сумму.</span> ';
  if(F.type==='expense'&&!F.edit&&x>0&&A.cur!==main){
    var r=simulate(A.id,x);
    if(r)s+='По FIFO ≈ '+fmt(r.cost,main)+(r.est>1e-9?' (часть по ориентировочному курсу)':'')+(r.unknown>1e-9?' (+ '+fmt(r.unknown,A.cur)+' без курса)':'');
  }
  if(F.type==='exchange'&&x>0&&y>0){var B=getAcc(F.to);if(B)s+='Курс: '+pairRate(A.cur,B.cur,x,y);}

function saveOp(){
  var x=num(F.amountS);if(!(x>0)){toast('Введи сумму больше нуля');return;}
  var t={id:F.id||uid(),seq:F.seq||S.seq++,date:F.date||today(),type:F.type,acc:F.acc,amount:x,note:(F.note||'').trim()};
  if(F.recId||F.isRec||(F.mkRec&&F.type==='expense'&&!F.opening))t.rec=true;
  if(F.opening){t.opening=true;if(F.rateMain)t.rateMain=F.rateMain;}
  if(F.type==='income'||F.type==='expense'){
    t.cat=F.opening?(F.cat||'Начальный остаток'):((F.cat||'').trim()||'Другое');
    if(subInfo(t.cat,F.sub))t.sub=F.sub;
    if(EMO[t.cat]==null&&S.settings.catIcons[t.cat]==null)S.settings.catIcons[t.cat]=F.icon||'🏷';
  }
  if(F.type==='transfer'||F.type==='exchange'){
    if(!F.to){toast('Выбери счёт, куда идут деньги');return;}
    t.to=F.to;
    if(F.type==='transfer')t.toAmount=x;
    else{var y=num(F.toS);if(!(y>0)){toast('Введи, сколько получаешь');return;}t.toAmount=y;}
  }
  var i=S.tx.findIndex(function(o){return o.id===t.id;});
  if(i>=0)S.tx[i]=t;else S.tx.push(t);
  S.settings.lastAcc=F.acc;
  var wasEdit=F.edit;
  if(F.recId){var rr=S.rec.filter(function(x){return x.id===F.recId;})[0];if(rr){rr.done=rr.done||{};rr.done[F.recYm]='paid';}}
  var mk=[];
  if(F.type==='expense'&&!F.opening){
    var nm=(t.note||'').trim()||t.cat;
    if(F.mkTpl&&!S.tpl.some(function(o){return o.acc===t.acc&&o.cat===t.cat&&o.amount===t.amount&&o.name===nm;})){S.tpl.push({id:uid(),name:nm,acc:t.acc,cat:t.cat,sub:t.sub||'',amount:t.amount,note:t.note||''});mk.push('tpl');}
    if(F.mkRec&&!F.recId&&!F.isRec){
      var same=function(x){return x.type==='expense'&&!x.opening&&x.acc===t.acc&&x.cat===t.cat&&x.amount===t.amount&&(x.note||'').trim().toLowerCase()===(t.note||'').trim().toLowerCase();};
      var ids=S.tx.filter(same).map(function(x){return x.id;}),last=t.date;
      S.tx.forEach(function(x){if(same(x)&&x.date>last)last=x.date;});
      if(makeRecFromMatches(nm,t.acc,t.cat,t.amount,+t.date.slice(8,10),ids,last.slice(0,7)))mk.push('rec');
    }
  }
  closeSheet();commit();
  var lm=wasEdit?'':limitMsg(t);
  var mkm=mk.length===2?'Сохранены шаблон и постоянный платёж':(mk[0]==='tpl'?'Сохранён шаблон':(mk[0]==='rec'?'Сохранён постоянный платёж':''));
  toast((wasEdit?'Сохранено':'Добавлено')+(lm?'. '+lm:'')+(mkm?'. '+mkm:''));
}

function backupCfg(){var b=S.settings.backup;if(!b||typeof b!=='object')b=S.settings.backup={on:true,dow:0,time:'20:00',snz:''};return b;}
function backupDue(){
  var b=backupCfg();if(!b.on)return false;
  var now=new Date(),t0=today();
  if(b.snz!==t0&&S.tx.length){
    /* пропустил день напоминания — напомним в любой день, если копии нет дольше недели */
    var first=S.tx.reduce(function(m,x){return x.date<m?x.date:m;},t0);
    if(S.settings.lastBackup?Date.now()-S.settings.lastBackup>=7*864e5:first<=dayShift(-7))return true;
  }
  if(now.getDay()!==(+b.dow))return false;
  var hm=(b.time||'20:00').split(':'),H=+hm[0]||0,M=+hm[1]||0;
  if(now.getHours()<H||(now.getHours()===H&&now.getMinutes()<M))return false;
  var t=today();
  if(b.snz===t)return false;
  if(S.settings.lastBackup){
    var lb=new Date(S.settings.lastBackup),lbDate=new Date(lb.getTime()-lb.getTimezoneOffset()*60000).toISOString().slice(0,10);
    if(lbDate===t)return false;
  }
  return true;
}

function bkName(){var d=new Date();return 'LuckyFinance_backup_'+today()+'_'+String(d.getHours()).padStart(2,'0')+'-'+String(d.getMinutes()).padStart(2,'0')+'.json';}
function isIOS(){return /iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}

function downloadBlob(name,text,mime){
  try{
    var b=new Blob([text],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(u);},1500);
    return true;
  }catch(e){return false;}
}
function deliverFile(name,text,mime){
  var file=null;try{file=new File([text],name,{type:mime});}catch(e){}
  if(isIOS()&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
    return navigator.share({files:[file],title:name}).then(function(){return true;}).catch(function(e){
      if(e&&e.name==='AbortError')return false;
      return downloadBlob(name,text,mime);
    });
  }
  return Promise.resolve(downloadBlob(name,text,mime));
}
/* Копия в приватный репозиторий GitHub. Токен лежит отдельным ключом, в резервные копии и сводку для Claude не попадает */
var GKEY='fin-mvp-gh',GH_BUSY=false;
function ghCfg(){var g={};try{g=JSON.parse(localStorage.getItem(GKEY)||'{}')||{};}catch(e){}return g;}
function ghSet(g){try{localStorage.setItem(GKEY,JSON.stringify(g));}catch(e){}}
function ghReady(g){return !!(g.repo&&g.token&&/^[\w.-]+\/[\w.-]+$/.test(g.repo));}
function ghHash(){var l=S.settings.lastBackup;S.settings.lastBackup=0;var j=JSON.stringify(S);S.settings.lastBackup=l;var h=5381;for(var i=0;i<j.length;i++)h=((h<<5)+h+j.charCodeAt(i))|0;return j.length+':'+h;}
function ghErr(st){return st===401?'токен не принят — проверь или создай новый':st===403?'у токена нет права записи в репозиторий (Contents: Read and write)':st===404?'репозиторий не найден или у токена нет к нему доступа':st===422?'файл с таким именем уже есть — подожди минуту':st===0?'нет интернета':'ошибка GitHub '+st;}
function ghUpload(silent){
  var g=ghCfg();
  if(!ghReady(g)){if(!silent)toast('Сначала укажи репозиторий и токен');return Promise.resolve(false);}
  if(GH_BUSY)return Promise.resolve(false);
  GH_BUSY=true;
  var text=backupJson(),hash=ghHash(),name=bkName();
  var body=JSON.stringify({message:'Резервная копия '+name,content:btoa(unescape(encodeURIComponent(text)))});
  return fetch('https://api.github.com/repos/'+g.repo+'/contents/backups/'+name,{method:'PUT',headers:{'Authorization':'Bearer '+g.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:body}).then(function(res){
    GH_BUSY=false;var g2=ghCfg();
    if(res.ok){g2.last=Date.now();g2.hash=hash;g2.err='';ghSet(g2);markBackup();if(!silent)toast('Копия выгружена на GitHub');if(nav.tab==='more')render();return true;}
    g2.err=ghErr(res.status);ghSet(g2);if(!silent)toast('GitHub: '+g2.err);if(nav.tab==='more')render();return false;
  }).catch(function(){GH_BUSY=false;var g2=ghCfg();g2.err=ghErr(0);ghSet(g2);if(!silent)toast('GitHub: '+g2.err);return false;});
}

function buildTpls(type){
  var m={};
  S.tx.forEach(function(t){
    if(t.type!==type||t.opening||!getAcc(t.acc))return;
    var k=t.acc+'|'+(t.cat||'')+'|'+(t.sub||'')+'|'+t.amount,o=m[k]||(m[k]={acc:t.acc,cat:t.cat||'Другое',sub:t.sub||'',amount:t.amount,n:0,last:''});
    o.n++;if(t.date>o.last)o.last=t.date;
  });
  var all=Object.keys(m).map(function(k){return m[k];});
  var freq=all.filter(function(o){return o.n>=2;}).sort(function(a,b){return b.n-a.n||(a.last<b.last?1:-1);});
  var rec=all.filter(function(o){return o.n<2;}).sort(function(a,b){return a.last<b.last?1:-1;});
  return freq.concat(rec).slice(0,5);
}

/* Лимит месяца одним кольцом: куски — траты по категориям с лимитом, серое — остальное, пусто — сколько ещё можно */
function limitDonutCard(st,ym){
  var l=limits(),main=S.settings.main,ks=Object.keys(l.cats).filter(function(c){return l.cats[c]>0;});
  if(!(l.total>0))return catLimitsCard(st);
  var segs=ks.map(function(c){return {k:c,v:st.cats[c]||0};}).sort(function(a,b){return b.v-a.v;}).slice(0,5);
  segs.forEach(function(x,i){x.c=SERIES[i];});
  var lim=0;segs.forEach(function(x){lim+=x.v;});
  var rest=Math.max(0,st.exp-lim),over=st.exp>l.total,scale=Math.max(l.total,st.exp),R=52,W=16,L=2*Math.PI*R,off=0;

  all.forEach(function(x){
    var len=x.v/scale*L;if(len<=0)return;var d=Math.max(len-2,0.5);
    svg+='<circle cx="66" cy="66" r="'+R+'" fill="none" stroke="'+x.c+'" stroke-width="'+W+'" stroke-dasharray="'+d.toFixed(2)+' '+(L-d).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 66 66)"><title>'+esc(x.k)+': '+fmt(x.v,main)+'</title></circle>';
    off+=len;
  });
  if(over)svg+='<circle cx="66" cy="66" r="'+(R+W/2+3)+'" fill="none" stroke="var(--expense)" stroke-width="2"/>';
  var left=l.total-st.exp;

  }).join('')+(rest>0?'<div class="lg" style="padding:5px 0"><span class="dot" style="background:var(--cother)"></span><span class="grow" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Прочее</span><span class="muted small num" style="flex:none">'+nfCompact.format(rest)+'</span></div>':'');
  return '<div class="card"><h3>Лимит месяца</h3><div class="row" style="gap:14px;align-items:center;margin-top:4px">'+svg+'<div class="grow small" style="min-width:0">'+lg+'</div></div>'+

/* Постоянные платежи */
function dueDate(ym,day){var dim=new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();return ym+'-'+String(Math.min(day,dim)).padStart(2,'0');}
function recDue(){
  var t=today(),cur=t.slice(0,7),prev=shiftMonth(cur,-1),out=[];
  S.rec.forEach(function(r){
    if(!getAcc(r.acc))return;
    [prev,cur].forEach(function(ym){
      if(ym<r.created||(r.done&&r.done[ym]))return;
      var d=dueDate(ym,r.day);if(d<=t)out.push({r:r,ym:ym,date:d});
    });
  });
  return out.sort(function(a,b){return a.date<b.date?-1:1;});
}
function recUpcoming(cur,days){
  var t=today(),end=dayShift(days),ym=t.slice(0,7),sum=0;
  S.rec.forEach(function(r){
    var a=getAcc(r.acc);if(!fcIn(a)||a.cur!==cur)return;
    for(var i=-1;i<=Math.ceil(days/28)+1;i++){
      var m=shiftMonth(ym,i);if(m<r.created||(r.done&&r.done[m]))continue;
      if(dueDate(m,r.day)<=end)sum+=r.amount;
    }
  });
  return sum;
}
function recHome(){
  var dues=recDue();if(!dues.length)return '';
  var main=S.settings.main;
  var cur=today().slice(0,7);
  return '<div class="card" style="border-color:var(--fx)"><h3 style="color:var(--ink)">Пора внести платежи</h3>'+dues.slice(0,3).map(function(d){
    var a=getAcc(d.r.acc),mon=d.ym!==cur?' <span class="small warn" style="font-weight:400">за '+new Date(d.ym+'-01T00:00:00').toLocaleDateString('ru-RU',{month:'short'})+'</span>':'';
    return '<div class="row" style="padding:6px 0;gap:8px"><div class="grow"><div class="t1">'+esc(d.r.name)+mon+'</div><div class="t2">'+fmt(d.r.amount,a.cur)+' · '+dshort(d.date)+'</div></div><button class="chip sm" data-a="recpay" data-id="'+d.r.id+'" data-ym="'+d.ym+'">Внести</button><button class="chip sm" data-a="recskip" data-id="'+d.r.id+'" data-ym="'+d.ym+'">Пропуск</button></div>';
  }).join('')+(dues.length>3?'<div class="small muted">И ещё '+(dues.length-3)+' — в «Ещё → Постоянные платежи»</div>':'')+'</div>';
}
function viewRec(){
  var main=S.settings.main;

    if(!S.rec.length)h+='<div class="card empty"><b>Платежей пока нет</b>Добавь аренду, интернет, подписки — и не забудешь внести.</div>';

function openRec(id){

  h+='<label>Число месяца (1–31)<input inputmode="numeric" data-f="dayS" value="'+esc(F.dayS)+'" autocomplete="off"></label><div class="hint">Если в месяце меньше дней, напомню в последний день месяца.</div>';

function saveRec(){
  var name=(F.name||'').trim(),x=num(F.amountS),d=Math.round(num(F.dayS));
  if(!name){toast('Введи название');return;}
  if(!(x>0)){toast('Введи сумму');return;}
  if(!(d>=1&&d<=31)){toast('Число месяца: от 1 до 31');return;}
  var o={id:F.id||uid(),name:name,amount:x,acc:F.acc,cat:F.cat||'Другое',day:d,done:{}};
  var i=S.rec.findIndex(function(r){return r.id===o.id;});
  if(i>=0){o.done=S.rec[i].done||{};o.created=S.rec[i].created;S.rec[i]=o;}
  else{var t=today(),cur=t.slice(0,7);o.created=dueDate(cur,d)<t?shiftMonth(cur,1):cur;S.rec.push(o);}
  closeSheet();commit();toast('Сохранено');

  var i=id?S.inv.filter(function(x){return x.id===id;})[0]:null;
  F={inv:true,id:id||'',where:i?i.where:'',what:i?i.what:'',cur:i?i.cur:S.settings.main,invS:i?inp(i.invested):'',nowS:i?inp(i.now):''};
  renderInv();
}
function renderInv(){
  var edit=!!F.id;
  var h='<h2>'+(edit?'Изменить актив':'Новый актив')+'</h2>';
  h+='<label>Где лежит<input data-f="where" value="'+esc(F.where)+'" placeholder="Например, Bybit или брокер" autocomplete="off"></label>';
  h+='<label>Во что вложено<input data-f="what" value="'+esc(F.what)+'" placeholder="Например, ETH или акции" autocomplete="off"></label>';
  h+='<label>Валюта<select data-f="cur">'+curOptions(F.cur)+'</select></label>';
  h+='<label>Вложено<div class="amtwrap"><input inputmode="decimal" data-f="invS" value="'+esc(F.invS)+'" placeholder="0" autocomplete="off"><span>'+F.cur+'</span></div></label>';
  h+='<label>Стоимость сейчас<div class="amtwrap"><input inputmode="decimal" data-f="nowS" value="'+esc(F.nowS)+'" placeholder="0" autocomplete="off"><span>'+F.cur+'</span></div></label>';
  h+='<button class="btn" data-a="saveinv">'+(edit?'Сохранить':'Добавить актив')+'</button>';
  if(edit)h+='<button class="btn ghost" data-a="delinv">Удалить актив</button>';
  openSheet(h);
}
function saveInv(){
  var what=(F.what||'').trim();if(!what){toast('Напиши, во что вложено');return;}
  var a=num(F.invS),b=num(F.nowS);
  if(!(a>=0)||!(b>=0)){toast('Введи суммы (0 или больше)');return;}
  var o={id:F.id||uid(),where:(F.where||'').trim(),what:what,cur:F.cur,invested:a,now:b,upd:today()};
  var i=S.inv.findIndex(function(x){return x.id===o.id;});
  if(i>=0)S.inv[i]=o;else S.inv.push(o);
  closeSheet();commit();toast('Сохранено');
}

/* На сколько хватит и калькулятор обмена */
function plural(n,a,b,c){var m=n%100,k=n%10;if(m>10&&m<20)return c;if(k===1)return a;if(k>1&&k<5)return b;return c;}
function fmtDays(d){if(d==null)return '—';if(d>=365)return 'больше года';if(d<1)return 'меньше суток';var n=Math.floor(d);return n+' '+plural(n,'день','дня','дней');}
function approxDays(d){return d==null?'—':(d>=365||d<1?fmtDays(d):'~'+fmtDays(d));}
function endDate(d){return new Date(Date.now()+Math.floor(d)*864e5).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});}
/* Счёт участвует в прогнозах? Выбирается отдельно от общей суммы на главной */
function fcIn(a){return !!a&&!S.settings.fcExcl[a.id];}
function calcTotal(fc){
  var main=S.settings.main,total=0;
  S.accounts.forEach(function(a){
    if(fc?!fcIn(a):a.excl)return;var b=C.accs[a.id].bal;
    if(a.cur===main){total+=b;return;}
    var r=rateToMain(a.cur);if(r!=null)total+=b*r;
  });
  return total;
}
/* Для прогнозов: счета валюты, отмеченные «в прогнозе» */
function curBalance(cur){var b=0;S.accounts.forEach(function(a){if(a.cur===cur&&fcIn(a))b+=C.accs[a.id].bal;});return b;}
function mustCats(){return S.settings.must||[];}
function isMust(x){return !!(x.rec||mustCats().indexOf(x.cat)>=0);}
function catCovered(cat,cur){return S.rec.some(function(r){var a=getAcc(r.acc);return r.cat===cat&&a&&a.cur===cur;});}
function monthlyRec(cur){var s=0;S.rec.forEach(function(r){var a=getAcc(r.acc);if(fcIn(a)&&a.cur===cur)s+=r.amount;});return s;}
function runDays(bal,perDay,sched){
  if(!(bal>0))return 0;
  for(var d=1;d<=366;d++){if(perDay*d+sched(d)>bal)return d-1;}
  return 400;
}
/* Прогноз: повседневные траты — в день; постоянные платежи вычитаются в свои дни;
   обязательные траты без расписания учитываются усреднённо за месяц. */
function runway(){return RW_CACHE||(RW_CACHE=runwayCalc());}
function runwayCalc(){
  var t=today(),first=null;
  S.tx.forEach(function(x){if(x.opening)return;if(!first||x.date<first)first=x.date;});
  if(!first)return {basis:0,since:0,per:[],total:null,gaps:[]};
  var since=Math.round((new Date(t+'T00:00:00')-new Date(first+'T00:00:00'))/864e5)+1;
  var basis=Math.max(3,Math.min(30,since));
  function ago(n){return new Date(Date.now()-new Date().getTimezoneOffset()*60000-n*864e5).toISOString().slice(0,10);}
  var fromV=ago(basis-1),fromU=ago(29),V={},U={},G={};
  S.tx.forEach(function(x){
    if(x.type!=='expense'||x.opening)return;
    var a=getAcc(x.acc);if(!fcIn(a)||isOneOff(x))return;var c=a.cur;
    if(!isMust(x)){if(x.date>=fromV)V[c]=(V[c]||0)+x.amount;return;}
    if(x.rec||x.date<fromU||catCovered(x.cat,c))return;
    U[c]=(U[c]||0)+x.amount;
    var k=c+'|'+x.cat,g=G[k]||(G[k]={cur:c,cat:x.cat,sum:0,acc:x.acc,amount:x.amount,date:x.date});
    g.sum+=x.amount;if(x.date>=g.date){g.acc=x.acc;g.amount=x.amount;g.date=x.date;}
  });
  var curs=[];
  [V,U].forEach(function(m){Object.keys(m).forEach(function(c){if(curs.indexOf(c)<0)curs.push(c);});});
  S.rec.forEach(function(r){var a=getAcc(r.acc);if(fcIn(a)&&curs.indexOf(a.cur)<0)curs.push(a.cur);});
  var list=curs.map(function(c){
    var v=(V[c]||0)/basis,u=(U[c]||0)/30,bal=curBalance(c),r=rateToMain(c)||0,mr=monthlyRec(c);
    var days=(v+u<=0&&mr<=0)?null:runDays(bal,v+u,function(d){return recUpcoming(c,d);});
    return {cur:c,daily:v,unsch:u,bal:bal,days:days,monthRec:mr,monthMust:u*30+mr,sched30:recUpcoming(c,30),unsch30:u*30,w:((v+u)*30+mr)*r};
  }).sort(function(a,b){return b.w-a.w;});
  var Vm=0,Um=0,mm=0,mrm=0,s30=0,rcs=[];
  list.forEach(function(p){var r=rateToMain(p.cur);if(r==null)return;Vm+=p.daily*r;Um+=p.unsch*r;mm+=p.monthMust*r;mrm+=p.monthRec*r;s30+=p.sched30*r;rcs.push({c:p.cur,r:r});});
  var tot=null;
  if(Vm+Um>0||mm>0){
    var tb=calcTotal('fc');
    tot={daily:Vm,unsch:Um,bal:tb,monthMust:mm,monthRec:mrm,sched30:s30,unsch30:Um*30,days:runDays(tb,Vm+Um,function(d){var sm=0;rcs.forEach(function(x){sm+=recUpcoming(x.c,d)*x.r;});return sm;})};
  }
  return {basis:basis,since:since,per:list,total:tot,gaps:Object.keys(G).map(function(k){return G[k];})};
}
/* Прогнозы показываем, только когда есть 30 дней данных — иначе средняя трата в день случайная */
var FC_DAYS=30;
function fcAccLine(){
  var n=S.accounts.filter(fcIn).length;
  return '<div class="row small muted" style="margin-top:10px"><span>В прогнозе счетов: '+n+' из '+S.accounts.length+'</span><button class="chip sm" data-a="fcpick">Выбрать</button></div>';
}
function renderFcPick(){
  var box=$('.sheet'),st=box?box.scrollTop:0;
  var h='<h2>Счета в прогнозе</h2><div class="small muted">Отключённый счёт не участвует в прогнозах «На сколько хватит», «К концу месяца» и «Сколько менять»: не учитываются ни его остаток, ни траты и платежи с него. На общую сумму на главной это не влияет.</div><div style="margin-top:8px">';
  S.accounts.forEach(function(a){
    h+='<button class="item" data-a="fctog" data-id="'+a.id+'"><div class="grow"><div class="t1">'+esc(a.name)+'</div><div class="t2">'+a.cur+' · '+fmt(C.accs[a.id].bal,a.cur)+'</div></div><span class="sw'+(fcIn(a)?' on':'')+'"></span></button>';
  });
  openSheet(h+'</div><button class="btn" data-a="close">Готово</button>');$('.sheet').scrollTop=st;
}
function fcReady(){var rw=runway();return rw.per.length>0&&rw.since>=FC_DAYS;}
function fcWaitText(){
  var rw=runway(),left=FC_DAYS-(rw.since||0);
  return 'Прогноз появится, когда накопится '+FC_DAYS+' дней операций — так средняя трата в день будет честной. '+(rw.since?'Осталось '+left+' '+plural(left,'день','дня','дней')+'.':'Начни вносить расходы.');
}
function runwayCard(){
  var rw=runway(),main=S.settings.main;
  if(!rw.per.length)return '';
  if(!fcReady())return '<div class="card"><h3>Прогноз</h3><div class="small muted">'+fcWaitText()+'</div>'+fcAccLine()+(S.accounts.some(function(a){return a.cur!==main;})?'<button class="btn plain sm" data-a="plan">Сколько менять?</button>':'')+'</div>';
  var h='<div class="card"><h3>На сколько хватит денег</h3>';
  rw.per.forEach(function(p){
    h+='<div class="row" style="padding:6px 0"><div class="grow"><div class="t1">'+p.cur+'</div><div class="t2">повседневно ~'+fmt(p.daily,p.cur)+' в день'+(p.monthMust>0?' · обязательные ~'+fmt(p.monthMust,p.cur)+' в месяц':'')+' · на счетах '+fmt(p.bal,p.cur)+'</div></div><div class="amt num">'+approxDays(p.days)+(p.days!=null&&p.days<365?'<small>до '+endDate(p.days)+'</small>':'')+'</div></div>';
  });
  if(rw.total&&rw.per.length>1)h+='<div class="row" style="padding:8px 0 0;margin-top:6px;border-top:1px solid var(--line)"><div class="grow"><div class="t1">Всего</div><div class="t2">все счета вместе, в пересчёте на '+main+'</div></div><div class="amt num">'+approxDays(rw.total.days)+(rw.total.days<365?'<small>до '+endDate(rw.total.days)+'</small>':'')+'</div></div>';
  h+='<div class="small muted" style="margin-top:8px">Повседневные траты считаются по последним '+rw.basis+' '+plural(rw.basis,'дню','дням','дням')+'. Обязательные (постоянные платежи и выбранные категории) в дневную сумму не входят: платежи по расписанию вычитаются в свои дни, остальные учитываются усреднённо.'+(rw.basis<7?' Данных пока мало, оценка грубая.':'')+'</div>'+fcAccLine();
  if(rw.gaps.length)h+='<div class="small" style="margin-top:8px"><a data-a="sub" data-v="rec" style="color:var(--fx);cursor:pointer">Обязательные траты ('+rw.gaps.map(function(g){return esc(g.cat);}).join(', ')+') пока не заведены как постоянные платежи — как это исправить</a></div>';
  h+='<button class="btn plain sm" data-a="runway" style="margin-right:8px">Подробный разбор</button>';
  if(S.accounts.some(function(a){return a.cur!==main;}))h+='<button class="btn plain sm" data-a="plan">Сколько менять?</button>';
  return h+'</div>';
}

/* Сверка остатков */
function reconCfg(){var r=S.settings.recon||(S.settings.recon={on:true,days:7,accs:{}});if(!r.accs)r.accs={};return r;}
function reconOn(a){var r=reconCfg();return r.accs[a.id]!==undefined?!!r.accs[a.id]:a.type==='cash';}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);}
function reconDue(){
  var r=reconCfg(),t=today(),out=[];
  if(!r.on)return out;
  S.accounts.forEach(function(a){
    if(!a.rc)a.rc=t;
    if(a.excl||!reconOn(a))return;
    if(a.snz&&a.snz>t)return;
    if(daysBetween(a.rc,t)>=r.days)out.push(a);
  });
  return out;
}
function reconHome(){
  var due=reconDue();if(!due.length)return '';
  return '<div class="card" style="border-color:var(--gold)"><h3 style="color:var(--ink)">Сверка остатков</h3><div class="small muted" style="margin:-4px 0 6px">Проверь, сходятся ли реальные деньги с тем, что в приложении.</div>'+due.slice(0,3).map(function(a){
    return '<div class="row" style="padding:6px 0"><div class="grow"><div class="t1">'+esc(a.name)+'</div><div class="t2">в приложении '+fmt(C.accs[a.id].bal,a.cur)+' · последняя сверка '+dshort(a.rc)+'</div></div><button class="chip" data-a="rcopen" data-id="'+a.id+'">Сверить</button><button class="chip" data-a="rcsnz" data-id="'+a.id+'" style="margin-left:6px">Позже</button></div>';
  }).join('')+(due.length>3?'<div class="small muted">И ещё '+(due.length-3)+' — в «Ещё → Сверка остатков»</div>':'')+'</div>';
}
function openRecon(id){var a=getAcc(id);if(!a)return;F={rc:true,id:id,balS:''};renderRecon();}
function renderRecon(){
  var a=getAcc(F.id),cur=C.accs[a.id].bal;
  openSheet('<h2>Сверка: '+esc(a.name)+'</h2><div class="small muted">В приложении сейчас <b>'+fmt(cur,a.cur)+'</b>. Пересчитай реальные деньги и введи, сколько на самом деле. Разницу я запишу как «Корректировку» — это не доход и не расход.</div>'+
    '<label>Сколько на самом деле<div class="amtwrap"><input inputmode="decimal" data-f="balS" value="'+esc(F.balS)+'" placeholder="'+inp(cur)+'" autocomplete="off"><span>'+a.cur+'</span></div></label><div class="hint" id="rchint"></div>'+
    '<button class="btn" data-a="rcsave">Записать разницу</button><button class="btn plain" data-a="rcok" style="margin-top:8px">Всё сходится</button><button class="btn plain" data-a="close" style="margin-top:8px">Отмена</button>');
  rcUpdate();
}
function rcUpdate(){
  var el=$('#rchint');if(!el||!F)return;var a=getAcc(F.id),b=num(F.balS);
  if(!(b>=0)){el.textContent='';return;}
  var d=b-C.accs[a.id].bal;
  el.textContent=Math.abs(d)<1e-9?'Совпадает с приложением.':'Разница: '+(d>0?'+':'−')+fmt(Math.abs(d),a.cur)+(d<0?' — деньги где-то потратились или потерялись.':' — нашлись лишние деньги.');
}
function saveRecon(){
  var a=getAcc(F.id),b=num(F.balS);
  if(!(b>=0)){toast('Введи сумму или нажми «Всё сходится»');return;}
  var d=b-C.accs[a.id].bal;a.rc=today();delete a.snz;
  if(Math.abs(d)>=1e-9)S.tx.push({id:uid(),seq:S.seq++,date:today(),type:d>0?'income':'expense',acc:a.id,amount:Math.abs(d),cat:'Корректировка',note:'Сверка остатка',opening:true});
  closeSheet();commit();toast(Math.abs(d)<1e-9?'Всё сходится':'Разница записана');
}
function reconStat(){
  var from=new Date(Date.now()-new Date().getTimezoneOffset()*60000-29*864e5).toISOString().slice(0,10),sum=0,n=0;
  S.tx.forEach(function(x){
    if(!x.opening||x.cat!=='Корректировка'||x.date<from||(x.note||'').indexOf('Сверка')<0)return;
    var v=txToMain(x);if(v==null)return;sum+=x.type==='income'?v:-v;n++;
  });
  return {sum:sum,n:n};
}
function viewRecon(){
  var r=reconCfg(),main=S.settings.main,st=reconStat();
  var h=backBar('Ещё','back2')+'<h1 style="margin-top:14px">Сверка остатков</h1><div class="small muted">Наличные и кошельки почти всегда расходятся с учётом. Раз в несколько дней приложение мягко попросит проверить остаток, а разницу запишет как «Корректировку» — она не считается доходом или расходом.</div>';
  h+='<div class="card"><div class="row"><h3 style="margin:0">Напоминать о сверке</h3><button class="sw'+(r.on?' on':'')+'" data-a="rcon" aria-label="Напоминать" style="border:0;padding:0"></button></div><div class="small muted" style="margin-top:12px">Как часто:</div><div class="chips" style="margin:6px 0 0">'+[[7,'Раз в неделю'],[14,'Раз в 2 недели'],[30,'Раз в месяц']].map(function(x){return '<button class="chip'+(r.days===x[0]?' on':'')+'" data-a="rcdays" data-v="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div></div>';
  h+='<div class="card" style="padding:4px 16px"><div class="small muted" style="padding:10px 0 2px">Какие счета сверять</div>';
  S.accounts.forEach(function(a){
    h+='<div class="item" style="cursor:default"><div class="grow"><div class="t1">'+esc(a.name)+'</div><div class="t2">последняя сверка '+dshort(a.rc||today())+' · '+fmt(C.accs[a.id].bal,a.cur)+'</div></div><button class="chip" data-a="rcopen" data-id="'+a.id+'" style="margin-right:8px">Сверить</button><button class="sw'+(reconOn(a)?' on':'')+'" data-a="rcacc" data-id="'+a.id+'" aria-label="Сверять счёт" style="border:0;padding:0"></button></div>';
  });
  h+='</div>';
  h+='<div class="card"><h3>Расхождения за 30 дней</h3>'+(st.n?'<div class="row"><span class="small muted">Сверок с разницей: '+st.n+'</span><span class="amt num '+(st.sum<0?'neg':'pos')+'">'+(st.sum<0?'−':'+')+fmt(Math.abs(st.sum),main)+'</span></div><div class="hint">Минус — деньги, которые «потерялись» и не попали в учёт.</div>':'<div class="small muted">Пока расхождений не было.</div>')+'</div>';
  return h;
}

/* Прогноз на конец месяца */
function monthEndInfo(){
  var t=today(),ym=t.slice(0,7),dim=new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate(),day=+t.slice(8,10);
  return {ym:ym,dim:dim,day:day,left:dim-day,end:ym+'-'+String(dim).padStart(2,'0')};
}
function forecast(){
  var rw=runway();if(!rw.per.length)return null;
  var me=monthEndInfo(),items=recItems(me.left);
  var per=rw.per.map(function(p){
    var sched=0;items.forEach(function(x){if(x.cur===p.cur)sched+=x.r.amount;});
    var perDay=p.daily+p.unsch,spend=perDay*me.left+sched;
    return {cur:p.cur,bal:p.bal,perDay:perDay,daily:p.daily,sched:sched,spend:spend,end:p.bal-spend};
  });
  var tot=null;
  if(rw.total){
    var schedM=0;items.forEach(function(x){var r=rateToMain(x.cur);if(r!=null)schedM+=x.r.amount*r;});
    var ei=S.settings.expInc,inc=(ei&&ei.ym===me.ym)?ei.amount:0;
    var perDayM=rw.total.daily+rw.total.unsch,spend=perDayM*me.left+schedM;
    tot={bal:rw.total.bal,spend:spend,sched:schedM,daily:rw.total.daily,unsch:rw.total.unsch,perDay:perDayM,inc:inc,end:rw.total.bal-spend+inc,
      room:rw.total.bal+inc-schedM-rw.total.unsch*me.left,avail:me.left>0?(rw.total.bal+inc-schedM-rw.total.unsch*me.left)/me.left:null};
  }
  return {me:me,per:per,total:tot};
}
function forecastCard(){
  if(!fcReady())return '';
  var f=forecast();if(!f)return '';
  var main=S.settings.main,me=f.me,t=f.total;
  function row(l,v,cls,sub){return '<div class="row" style="padding:5px 0"><div class="grow"><div class="small muted">'+l+'</div>'+(sub?'<div class="t2">'+sub+'</div>':'')+'</div><span class="num'+(cls?' '+cls:'')+'" style="font-weight:600;text-align:right">'+v+'</span></div>';}
  var h='<div class="card"><h3>Прогноз на конец месяца</h3><div class="small muted" style="margin:-4px 0 8px">До '+dshort(me.end)+(me.left>0?' — ещё '+me.left+' '+plural(me.left,'день','дня','дней'):' — сегодня последний день')+'</div>';
  if(t){
    h+=row('Сейчас на счетах',fmt(t.bal,main));
    h+=row('Ещё уйдёт','−'+fmt(t.spend,main),'','повседневные ~'+fmt(t.perDay,main)+' в день'+(t.sched>0?' + платежи '+fmt(t.sched,main):''));
    h+=row('Ожидаемые поступления',t.inc>0?'+'+fmt(t.inc,main):'—','pos');
    h+='<div class="row" style="padding:8px 0 0;margin-top:6px;border-top:1px solid var(--line)"><span>К концу месяца</span><span class="amt num '+(t.end<0?'neg':'pos')+'">'+(t.end<0?'−':'≈ ')+fmt(Math.abs(t.end),main)+'</span></div>';
    if(t.avail!=null){
      h+='<div class="small" style="margin-top:8px">'+(t.avail>=0?'Чтобы закончить месяц в плюсе, повседневно можно тратить не больше ~'+fmt(t.avail,main)+' в день (сейчас ~'+fmt(t.daily,main)+').':'Даже без повседневных трат не хватает '+fmt(-t.room,main)+' — стоит пополнить счета.')+'</div>';

}

function recCandidates(){
  var from=dayShift(-90),m={},must=mustCats();
  function dd(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);}
  S.tx.forEach(function(x){
    if(x.type!=='expense'||x.opening||x.rec||x.date<from||!getAcc(x.acc))return;
    var note=(x.note||'').trim(),k=x.acc+'|'+x.cat+'|'+x.amount+'|'+note.toLowerCase();
    var o=m[k]||(m[k]={acc:x.acc,cat:x.cat,amount:x.amount,note:note,n:0,last:x.date,ids:[],dates:[]});
    o.n++;o.ids.push(x.id);o.dates.push(x.date);if(x.date>o.last)o.last=x.date;
  });
  var all=Object.keys(m).map(function(k){return m[k];}).filter(function(o){
    return !S.rec.some(function(r){return r.acc===o.acc&&r.amount===o.amount&&r.name===(o.note||o.cat);});
  });
  all.forEach(function(o){
    o.dates.sort();var gaps=[];for(var i=1;i<o.dates.length;i++)gaps.push(dd(o.dates[i-1],o.dates[i]));
    o.monthly=gaps.some(function(g){return g>=24&&g<=38;});
    o.frequent=o.n>=3&&(dd(o.dates[0],o.dates[o.n-1])/(o.n-1))<15;
    o.must=must.indexOf(o.cat)>=0;
  });
  var cand=all.filter(function(o){return !o.frequent;});
  var singles=cand.filter(function(o){return !o.monthly&&!o.must;}).sort(function(a,b){return b.amount-a.amount;}).slice(0,5);
  cand=cand.filter(function(o){return o.monthly||o.must;}).concat(singles);
  cand.forEach(function(o){o.rank=o.monthly?0:(o.must?1:2);});
  return cand.sort(function(a,b){return a.rank-b.rank||(a.last<b.last?1:-1);}).slice(0,15);
}

  ids.forEach(function(id){var x=S.tx.filter(function(t){return t.id===id;})[0];if(x){x.rec=true;done[x.date.slice(0,7)]='paid';}});
  S.rec.push({id:uid(),name:name,amount:amount,acc:acc,cat:cat,day:day,done:done,created:lastYm});
  return true;
}

function planUpdate(){
  var out=$('#planOut'),sub=$('#planSub'),btn=$('#planBtn');if(!out)return;
  var main=S.settings.main,cur=F.cur,days=num(F.daysS),daily=num(F.dailyS),buf=num(F.bufS),n=numR(F.rateS);
  if(!(buf>=0))buf=0;F.need=0;btn.hidden=true;sub.className='hint';
  if(!(days>0&&daily>0&&n>0)){out.textContent='—';sub.textContent='Заполни дни, траты в день и курс.';return;}
  var r=WEAK.indexOf(cur)>=0?1/n:n,bal=curBalance(cur);
  var recSum=(F.recOn!==false)?recUpcoming(cur,days):0;
  var need=days*daily*(1+buf/100)+recSum-bal;
  if(need<=0){var cov=runDays(bal,daily,function(dd){return F.recOn!==false?recUpcoming(cur,dd):0;});out.textContent='Менять не нужно';sub.textContent='На счетах '+fmt(bal,cur)+' — с учётом платежей этого хватит примерно на '+fmtDays(cov)+' даже без запаса.';return;}
  var mainNeed=need*r,mainBal=curBalance(main);
  F.need=need;F.needMain=mainNeed;F.r=r;
  out.textContent='≈ '+fmt(mainNeed,main);
  var msg='Получишь ≈ '+fmt(need,cur)+' по курсу '+showRate(cur,r)+'. Вместе с остатком '+fmt(bal,cur)+' хватит на '+days+' '+plural(days,'день','дня','дней')+' с запасом '+buf+'%.'+(recSum>0?' Учтены постоянные платежи: '+fmt(recSum,cur)+'.':'');
  if(mainNeed>mainBal+1e-9){msg+=' На счетах в '+main+' сейчас только '+fmt(mainBal,main)+'.';sub.className='hint warn';}
  sub.textContent=msg;btn.hidden=false;
}

/* Автообновление курсов (работает в установленной версии; в Claude блокируется) */
function errMsg(e){return e&&(e.message||String(e))||'неизвестная ошибка';}
var RATE_DIAG={cbr:'',mkt:'',ts:0};
function getJson(url){return fetch(url).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();});}
/* Один запрос даёт сразу и обычные валюты, и крипту. Основной сервер — jsDelivr,
   если он не ответит — запасной на Cloudflare. */
function fetchRatesApi(){
  var primary='https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json';
  var fallback='https://latest.currency-api.pages.dev/v1/currencies/usd.min.json';
  return getJson(primary).catch(function(){return getJson(fallback);});
}
function refreshMarket(){
  var mk=Object.assign({},(S.mkt&&S.mkt.rub)||{});mk.RUB=1;
  return fetchRatesApi().then(function(j){
    var r=j.usd||{};if(!(r.rub>0))throw new Error('в ответе нет курса рубля');
    Object.keys(r).forEach(function(k){var code=k.toUpperCase();if(r[k]>0)mk[code]=r.rub/r[k];});
    mk.RUB=1;mk.USD=r.rub;RATE_DIAG.mkt='';
    return {fiatOk:true,cryptoOk:true};
  }).catch(function(e){
    RATE_DIAG.mkt=errMsg(e);return {fiatOk:false,cryptoOk:false};
  }).then(function(res){
    if(res.fiatOk)S.mkt={date:today(),ts:Date.now(),rub:mk};
    return res;
  });
}
function refreshRates(manual){
  if(typeof fetch!=='function'){if(manual)toast('Обновление курсов доступно в установленной версии');return Promise.resolve();}
  var p1=getJson('https://www.cbr-xml-daily.ru/daily_json.js').then(function(j){
    var rub={RUB:1};Object.keys(j.Valute).forEach(function(k){var v=j.Valute[k];rub[k]=v.Value/v.Nominal;});
    S.auto={date:String(j.Date).slice(0,10),src:'ЦБ РФ',rub:rub};RATE_DIAG.cbr='';return true;
  }).catch(function(e){RATE_DIAG.cbr=errMsg(e);return false;});
  return Promise.all([p1,refreshMarket()]).then(function(rs){
    RATE_DIAG.ts=Date.now();
    save();C=compute();render();
    if(manual){
      var parts=['ЦБ '+(rs[0]?'✓':'✕'),'Валюты и крипта '+(rs[1].fiatOk?'✓':'✕')];
      toast((rs[0]||rs[1].fiatOk?'Курсы обновлены':'Не удалось обновить')+' — '+parts.join(' · '));
    }
  });
}
function rateAgeText(){
  var mktAge=S.mkt?Math.round((Date.now()-(S.mkt.ts||0))/36e5):null;
  return mktAge!=null?('Обновлён '+(mktAge<1?'меньше часа назад':mktAge+' '+plural(mktAge,'час','часа','часов')+' назад')):'Курс ещё не загружен';
}
function rateDiag(){
  if(!RATE_DIAG.ts)return '';
  var parts=[];
  if(RATE_DIAG.cbr)parts.push('ЦБ: '+esc(RATE_DIAG.cbr));
  if(RATE_DIAG.mkt)parts.push('Валюты и крипта: '+esc(RATE_DIAG.mkt));
  if(!parts.length)return '';
  return '<div class="hint warn" style="margin-top:8px">Последний раз не получилось: '+parts.join('; ')+'. Если видишь «Failed to fetch» — скорее всего сайт не разрешает запросы из браузера (CORS) или заблокирован в твоей сети; пришли этот текст мне.</div>';
}
function checkAppUpdate(){
  if(typeof fetch!=='function')return;
  fetch('version.json?ts='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
    if(j&&j.version&&j.version!==VERSION){NEW_VERSION=j.version;render();}
  }).catch(function(){});
}
function applyAppUpdate(){
  if('serviceWorker' in navigator&&navigator.serviceWorker.getRegistrations){
    navigator.serviceWorker.getRegistrations().then(function(regs){return Promise.all(regs.map(function(r){return r.unregister();}));})
      .then(function(){return ('caches' in window)?caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}):null;})
      .then(function(){location.reload();}).catch(function(){location.reload();});
  }else location.reload();
}
function askPersist(){
  try{
    if(navigator.storage&&navigator.storage.persist){
      navigator.storage.persisted().then(function(p){
        if(p){persisted=true;return;}
        return navigator.storage.persist().then(function(ok){persisted=ok;});
      }).catch(function(){});
    }
  }catch(e){}
}

  wipe:function(){ask('Удалить все счета, операции и настройки? Это нельзя отменить — сначала сделай резервную копию.','Удалить всё',function(){undoable(function(){S=fresh();nav={tab:'home',acc:null,filter:'all',sub:null,rep:'',q:'',per:'all',facc:'',fcat:''};},'Всё удалено');});}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var f=H[el.dataset.a];if(f)f(el,e);
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(isAmtInput(el))fmtField(el,e);
  if(el.dataset.cq){filterCurs(el.value);return;}
  if(el.dataset.ctq){filterCats(el.value);return;}
  if(el.dataset.q){nav.q=el.value;var box=$('#opsList');if(box)box.innerHTML=opsListHtml(opsFiltered());return;}
  if(el.dataset.w&&W){wizInput(el);return;}
  if(el.dataset.f&&F){
    F[el.dataset.f]=el.value;
    if(F.calc)calcUpdate();else if(F.bal)balUpdate();else if(F.sv)svUpdate();else if(F.plan)planUpdate();else if(F.rc)rcUpdate();else if(F.sva)svaUpdate();else if(F.gc)gcUpdate();else if(F.type)updateHint();
  }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset.w&&W){wizInput(el);return;}
  if(el.id==='bkfile'){readBkFile(el);return;}
  if(el.dataset.bk==='time'){backupCfg().time=el.value||'20:00';save();render();return;}
  if(el.dataset.nf){nav[el.dataset.nf]=el.value;render();return;}
  if(el.dataset.lim==='total'){var v=num(el.value),l=S.settings.limit||(S.settings.limit={total:0,cats:{}});l.total=v>0?v:0;commit();return;}
  if(el.dataset.f==='cat'&&F&&F.type){
    if(el.value!==F.cat)F.sub='';
    F.cat=el.value;
    var nm=(el.value||'').trim();
    F.showIcon=!!(nm&&catsFor(F.type).indexOf(nm)<0&&EMO[nm]==null&&(S.settings.catIcons[nm]==null));
    if(!F.showIcon)F.icon=null;
    renderOp();return;
  }
  if(el.tagName==='SELECT'&&el.dataset.f==='cur'&&el.value==='__all'&&F&&(F.acc===true||F.inv||F.debt)){
    var rr=F.acc===true?renderAcc:F.inv?renderInv:renderDebt;
    openCurPicker(function(code){if(!F)return;F.cur=code;rr();},function(){if(!F)return;rr();});
    return;
  }
  if(el.dataset.f&&F){
    F[el.dataset.f]=el.value;
    if(el.tagName==='SELECT'){
      if(F.calc){renderCalc(S.accounts.filter(function(a){return a.cur!==S.settings.main;}));}
      else if(F.acc===true){renderAcc();}
      else if(F.sv){renderSave();}
      else if(F.inv){renderInv();}
      else if(F.debt){renderDebt();}
      else if(F.plan){planInit();renderPlan();}
      else if(F.sva){renderSvAdj();}
      else if(F.rf){renderRec();}
      else if(F.type){if(el.dataset.f==='acc')F.to='';renderOp();}
    }
  }else if(el.dataset.set==='main'){
    if(el.value==='__all'){openCurPicker(function(code){S.settings.main=code;closeSheet();commit();},function(){closeSheet();render();});return;}
    S.settings.main=el.value;commit();
  }else if(el.dataset.rate){
    var c=el.dataset.rate,v=numR(el.value);
    if(v>0)S.settings.rates[c]=WEAK.indexOf(c)>=0?1/v:v;else delete S.settings.rates[c];
    commit();
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();});

function applyTheme(v){
  var r=document.documentElement;
  if(v==='light'||v==='dark')r.setAttribute('data-theme',v);else r.removeAttribute('data-theme');
}
function curPal(){try{return localStorage.getItem(PKEY)||'base';}catch(e){return 'base';}}
function applyPalette(k){
  var r=document.documentElement,pl=PALS.filter(function(x){return x[0]===k;})[0],m=document.querySelector('meta[name="theme-color"]');
  if(pl)r.setAttribute('data-pal',k);else r.removeAttribute('data-pal');
  if(m)m.setAttribute('content',pl?pl[2]:'#16202B');
}
try{applyTheme(localStorage.getItem(TKEY)||'auto');}catch(e){}
applyPalette(curPal());
(function(){
  var kb=document.getElementById('kbhide'),vv=window.visualViewport;
  function place(){
    if(!kb)return;
    if(vv){var gap=Math.max(0,window.innerHeight-(vv.height+vv.offsetTop));kb.style.bottom=(gap+16)+'px';}
  }
  function isField(el){return el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA')&&el.type!=='file'&&el.type!=='range';}
  document.addEventListener('focusin',function(e){if(isField(e.target)){place();kb&&kb.classList.add('show');}});
  document.addEventListener('focusout',function(){setTimeout(function(){if(!isField(document.activeElement))kb&&kb.classList.remove('show');},60);});
  if(vv)vv.addEventListener('resize',place);
  if(kb)kb.addEventListener('click',function(){var a=document.activeElement;if(isField(a))a.blur();kb.classList.remove('show');});
  document.addEventListener('keydown',function(e){if(e.key==='Enter'&&isField(e.target)&&e.target.tagName==='INPUT'){e.target.blur();}});
})();

if(!S.accounts.length&&!S.settings.wizardDone)openWizard();
if(!S.mkt||Date.now()-(S.mkt.ts||0)>6*36e5||S.auto.date<today())refreshRates(false);
})();
